[package]
name = "shards-api"
version = "0.1.0"
description = "Linux guests booted through the shards binary, for other programs: its client, a simulator, and the conformance suite both pass"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
sha2 = "0.11"
shards-abi = { path = "../abi" }
shards-dns = { path = "../dns" }
shards-ipc = { path = "../ipc" }
# The controller of a run's agent-control endpoint (D238, D252): Shards' own, re-exported.
shards-remote = { path = "../remote" }
triomphe = { version = "=0.1.17", default-features = false, features = ["std", "unsize"] }
unsize = "=1.1.0"
# A credential's bytes wiped as they drop (D242), as shards wipes its own (google.rs).
zeroize = "1"
# A run's upstream roots (D242): PEM read as rustls reads it (RFC 7468), and each certificate
# parsed as webpki parses a trust anchor, as the run's injector will.
rustls-pki-types = { version = "1.15.1", features = ["std"] }
rustls-webpki = { version = "0.103.16", default-features = false, features = ["std"] }

[target.'cfg(unix)'.dependencies]
libc = { workspace = true }

[target.'cfg(windows)'.dependencies]
shards-afunix = { path = "../afunix" }
# A guest's VM process followed (D215): Toolhelp32's snapshot of its descendants,
# QueryProcessCycleTime's count of the cycles they ran, and NtQuerySystemInformation's
# records of their threads' states and wait reasons (KWAIT_REASON), which tell one its host
# holds from one that waits on itself.
windows-sys = { workspace = true, features = [
  "Wdk_System_SystemInformation",
  "Wdk_System_SystemServices",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_System_Pipes",
  "Win32_System_WindowsProgramming",
] }

[dev-dependencies]
shards-testdir = { path = "../testdir" }
# Test roots, DER and PEM, for a run's upstream roots (D242).
rcgen = { version = "0.14.10", default-features = false, features = ["aws_lc_rs", "pem"] }

[lints]
workspace = true

[package]
name = "shards-ext4"
version = "0.1.0"
description = "ext4 file systems as Linux mounts them: a run's writable layer, made empty on the host"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dev-dependencies]
flate2 = { version = "1", default-features = false, features = ["zlib-rs", "runtime_detection"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"

[package]
name = "shards"
version = "0.1.0"
description = "shards: microVMs for agents, designed for home or at scale"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
autobins = false

# The command, which links only the standard library, shards-ipc and shards-cmdline, so it
# starts fast.
[[bin]]
name = "shards"
path = "src/bin/shards/main.rs"

# The daemon, pulls and the guest: every command but `run`, the container commands and
# `vm`.
[[bin]]
name = "shardsd"
path = "src/main.rs"

# One microVM per process, booted or restored: `shards vm`, and the daemon's VMs. It
# links the VMM and what a VM process runs, and nothing of shardsd's.
[[bin]]
name = "shards-vm"
path = "src/bin/shards-vm/main.rs"

# One microVM's network process (D31): its guest's flows to the host's sockets, apart from
# the VM process, which stays without TCP.
[[bin]]
name = "shards-net"
path = "src/bin/shards-net/main.rs"

[lints]
workspace = true

[features]
# Counts the heap and page faults of each phase of a build, printed to stderr as it ends
# (src/alloc_count.rs; docs/research/measurements/build-memory). For measurements only.
alloc-count = []

[dependencies]
shards-abi = { path = "../abi" }
shards-net = { path = "../net" }
shards-netring = { path = "../netring" }
shards-user = { path = "../user" }
shards-build = { path = "../build" }
shards-cmdline = { path = "../cmdline" }
shards-dockerfile = { path = "../dockerfile" }
shards-image = { path = "../image" }
shards-ipc = { path = "../ipc" }
shards-registry = { path = "../registry" }
shards-vmm = { path = "../vmm" }
sha2 = "0.11"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(unix)'.dependencies]
libc = { workspace = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true }

[dev-dependencies]
shards-testguest = { path = "../testguest" }

[[bench]]
name = "boot"
harness = false

[[bench]]
name = "restore"
harness = false

[[bench]]
name = "firecracker"
harness = false

[[bench]]
name = "run"
harness = false

[[bench]]
name = "image"
harness = false

[[bench]]
name = "workloads"
harness = false

[[bench]]
name = "arrival"
harness = false

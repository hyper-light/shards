[package]
name = "shards"
version = "0.1.0"
description = "shards: microVMs for agents, designed for home or at scale"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
autobins = false

# The one binary: every command, the daemon included. It links no framework that loads
# at launch, so it starts as fast as a command alone would (PM M113).
[[bin]]
name = "shards"
path = "src/main.rs"

[lints]
workspace = true

[features]
# Counts the heap and page faults of each phase of a build, printed to stderr as it ends
# (src/alloc_count.rs; docs/research/measurements/build-memory). For measurements only.
alloc-count = []

[dependencies]
shards-abi = { path = "../abi" }
shards-net = { path = "../net" }
shards-netring = { path = "../netring" }
shards-user = { path = "../user" }
shards-build = { path = "../build" }
shards-cmdline = { path = "../cmdline" }
shards-dockerfile = { path = "../dockerfile" }
shards-image = { path = "../image" }
shards-ipc = { path = "../ipc" }
shards-tui = { path = "../tui" }
shards-registry = { path = "../registry" }
shards-vmm = { path = "../vmm" }
sha2 = "0.11"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(unix)'.dependencies]
libc = { workspace = true }

[target.'cfg(target_os = "macos")'.dependencies]
shards-apple = { path = "../apple" }

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true }

[build-dependencies]
# The helpers' digests (build.rs).
sha2 = "0.11"

[dev-dependencies]
shards-testguest = { path = "../testguest" }
# `load`'s archives of every compression (tests/containers.rs), written in-process.
bzip2 = "0.6"
lzma-rust2 = { version = "0.21", default-features = false, features = ["std", "xz", "encoder"] }
ruzstd = "0.9"

[[bench]]
name = "boot"
harness = false

[[bench]]
name = "restore"
harness = false

[[bench]]
name = "firecracker"
harness = false

[[bench]]
name = "run"
harness = false

[[bench]]
name = "image"
harness = false

[[bench]]
name = "workloads"
harness = false

[[bench]]
name = "arrival"
harness = false

[package]
name = "shards"
version = "0.5.0"
description = "shards: microVMs for agents, designed for home or at scale"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
autobins = false

# The one binary: every command, the daemon included. It links no framework that loads
# at launch, so it starts as fast as a command alone would (PM M113).
[[bin]]
name = "shards"
path = "src/main.rs"

[lints]
workspace = true

[features]
# Counts the heap and page faults of each phase of a build, printed to stderr as it ends
# (src/alloc_count.rs; docs/research/measurements/build-memory). For measurements only.
alloc-count = []

[dependencies]
shards-abi = { path = "../abi" }
shards-net = { path = "../net" }
shards-netring = { path = "../netring" }
shards-user = { path = "../user" }
shards-template = { path = "../template" }
shards-build = { path = "../build" }
shards-cmdline = { path = "../cmdline" }
shards-dockerfile = { path = "../dockerfile" }
shards-flate = { path = "../flate" }
shards-zstd = { path = "../zstd" }
shards-git = { path = "../git" }
shards-seccomp = { path = "../seccomp" }
shards-image = { path = "../image" }
regex = "1"
shards-ipc = { path = "../ipc" }
shards-tui = { path = "../tui" }
shards-registry = { path = "../registry" }
shards-vmm = { path = "../vmm" }
sha2 = "0.11"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
shards-archive = { path = "../archive" }
shards-rego = { path = "../rego" }
shards-gitsign = { path = "../gitsign" }
shards-sigstore = { path = "../sigstore" }
shards-tuf = { path = "../tuf" }
# The keys `build --ssh ID=FILE` serves its steps, signed with (build/sshkey.rs).
aws-lc-rs = { version = "1.18.1", default-features = false, features = ["aws-lc-sys"] }
base64 = "0.23.1"
zeroize = "1"
yaml-rust2 = "0.13.0"
time = { version = "0.3.55", features = ["parsing"] }

[target.'cfg(unix)'.dependencies]
libc = { workspace = true }

[target.'cfg(target_os = "macos")'.dependencies]
shards-apple = { path = "../apple" }

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true }

[build-dependencies]
# The helpers' digests (build.rs).
sha2 = "0.11"

[dev-dependencies]
shards-testguest = { path = "../testguest" }
# `load`'s archives of every compression (tests/containers.rs), written in-process.
bzip2 = "0.6"
lzma-rust2 = { version = "0.21", default-features = false, features = ["std", "xz", "encoder"] }
ruzstd = "0.9"
# Built layers, gzipped (D75), read back (tests/build.rs).
flate2 = { version = "1", default-features = false, features = ["zlib-rs", "runtime_detection"] }

[[bench]]
name = "boot"
harness = false

[[bench]]
name = "restore"
harness = false

[[bench]]
name = "firecracker"
harness = false

[[bench]]
name = "run"
harness = false

[[bench]]
name = "image"
harness = false

[[bench]]
name = "workloads"
harness = false

[[bench]]
name = "arrival"
harness = false

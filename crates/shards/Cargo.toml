[package]
name = "shards"
version = "0.1.0"
description = "shards: rootless microVMs you build and run like containers"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
shards-vmm = { path = "../vmm" }

[target.'cfg(unix)'.dependencies]
libc = { workspace = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true }

[dev-dependencies]
sha2 = "0.10"
shards-abi = { path = "../abi" }
shards-testguest = { path = "../testguest" }

[[bench]]
name = "boot"
harness = false

[[bench]]
name = "restore"
harness = false

[[bench]]
name = "firecracker"
harness = false

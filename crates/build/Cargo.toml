[package]
name = "shards-build"
version = "0.1.0"
description = "What shards build does to files: BuildKit's file operations and layers, in memory"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
shards-abi = { path = "../abi" }
shards-dockerfile = { path = "../dockerfile" }
shards-image = { path = "../image" }
# ADD's archives: gzip, bzip2 and xz decoded in-process, pure Rust (PM M77).
bzip2 = "0.6"
flate2 = { version = "1", default-features = false, features = ["zlib-rs", "runtime_detection"] }
lzma-rust2 = { version = "0.21", default-features = false, features = ["std", "xz"] }
# Skill names NFKC-normalized, as the Agent Skills reference validator reads them (D54).
unicode-normalization = "0.1.25"

[target.'cfg(unix)'.dependencies]
libc = { workspace = true }

[dev-dependencies]
serde_json = "1"

[target.'cfg(unix)'.dev-dependencies]
libc = { workspace = true }

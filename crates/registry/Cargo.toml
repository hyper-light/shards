[package]
name = "shards-registry"
version = "0.1.0"
description = "Pulling images for shards microVMs from OCI registries"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
base64 = "0.23.1"
form_urlencoded = "1.2.2"
httparse = "1.10.1"
iri-string = "0.7.14"
rustls = { version = "0.23.45", default-features = false, features = ["std", "tls12", "aws_lc_rs", "prefer-post-quantum"] }
# Content-Encoding a registry may send, decoded as containerd decodes it.
flate2 = { version = "1", default-features = false, features = ["zlib-rs", "runtime_detection"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
shards-image = { path = "../image" }
time = { version = "0.3.55", features = ["parsing"] }

[target.'cfg(target_os = "macos")'.dependencies]
shards-apple = { path = "../apple" }

[target.'cfg(not(target_os = "macos"))'.dependencies]
rustls-platform-verifier = "0.7.1"

[target.'cfg(target_os = "macos")'.dev-dependencies]
# What the macOS verifier is held to: it trusts and refuses as this one did (apple.rs).
rustls-platform-verifier = "0.7.1"

[target.'cfg(unix)'.dependencies]
# The daemon's children, credential helpers among them, made by its spawner (PM M158).
shards-ipc = { path = "../ipc" }
libc = { workspace = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true }

[dev-dependencies]
shards-testdir = { path = "../testdir" }
ruzstd = "0.9"
rcgen = { version = "0.14.10", default-features = false, features = ["aws_lc_rs", "pem"] }

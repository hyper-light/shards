[package]
name = "shards-sigstore"
version = "0.1.0"
description = "Sigstore bundles verified as sigstore-go v1.2.2 and BuildKit's policy helpers verify them, for build policies"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
aws-lc-rs = { version = "1.18.1", default-features = false, features = ["aws-lc-sys"] }
aws-lc-sys = "0.45.0"
base64 = "0.23.1"
num-bigint = "0.4.8"
shards-dockerfile = { path = "../dockerfile" }
shards-gitsign = { path = "../gitsign" }
shards-tuf = { path = "../tuf" }

[dev-dependencies]
serde_json = "1"

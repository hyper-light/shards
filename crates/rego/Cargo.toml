[package]
name = "shards-rego"
version = "0.1.0"
description = "Rego as OPA v1.14.1 runs it, for buildx's build policies"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
num-bigint = "0.4.8"
regex = "1.13.1"
serde_json = "1"
shards-template = { path = "../template" }

[dev-dependencies]
serde_json = "1"

# benches/policy.rs reads its peak memory with getrusage(2).
[target.'cfg(unix)'.dev-dependencies]
libc = { workspace = true }

[[bench]]
name = "policy"
harness = false

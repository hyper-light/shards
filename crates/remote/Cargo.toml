[package]
name = "shards-remote"
version = "0.1.0"
description = "shards on another machine (D180): a home's identity, invitations and joins, and requests over QUIC"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
aws-lc-rs = { version = "1.18.1", default-features = false, features = ["aws-lc-sys"] }
bytes = "1"
# QUIC (RFC 9000, 9001, 9002) and TLS 1.3 over it, as the user's ../hyper-raft conforms them:
# quinn-proto 0.11.18 and rustls 0.23.45 (D180). Without its qlog traces, whose crate turns on
# serde_json's `preserve_order` for the whole build: shards' JSON is Docker's, its maps sorted
# (hyper-quic's VENDORED.md §20).
# hyper-raft's branch p/q35-handshake-progress-v1, main once its consumers' suites pass: the
# negotiated idle timeout read by patch Q34 (hyper-quic VENDORED.md §50), and a handshake's
# progress by patch Q35 (§51).
# No certificate compression on a raw public key's link: shards' own TLS configs offer and use
# none (tls.rs, `tls_client`/`tls_server`).
hyper-quic = { git = "https://github.com/hyper-light/hyper-raft", rev = "e0613f524b0df198cc61dc1e82b33c22d604cf7b", default-features = false }
sha2 = "0.11"
# A file of its user's alone wherever it is: an identity's, an invitation's.
shards-ipc = { path = "../ipc" }
shards-abi = { path = "../abi" }

[dev-dependencies]
shards-testdir = { path = "../testdir" }

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = ["Win32_Networking_WinSock"] }

[lints]
workspace = true

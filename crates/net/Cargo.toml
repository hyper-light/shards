[package]
name = "shards-net"
version = "0.1.0"
description = "A microVM's network process: its guest's frames to the host's sockets"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
shards-abi = { path = "../abi" }
shards-dns = { path = "../dns" }
shards-netring = { path = "../netring" }
shards-ipc = { path = "../ipc" }
# The run's CA (D242): rcgen over AWS-LC, as shards-server makes its own (crates/server).
rcgen = { version = "0.14.10", default-features = false, features = ["aws_lc_rs"] }
time = { version = "0.3.55", default-features = false }
# A credential's value wiped as its lease ends (D242), as shards wipes its own (google.rs).
zeroize = "1"
# The injector's TLS, both ways (D242): rustls over AWS-LC, as shards-server serves its own.
rustls = { version = "0.23.45", default-features = false, features = ["std", "aws_lc_rs"] }
# Its host's side verified as the registry's client verifies (D19, D242).
shards-verify = { path = "../verify" }
# HTTP/1.1 heads read where they lie (RFC 9112), as the registry's client reads them.
httparse = "1.10.1"

[target.'cfg(unix)'.dependencies]
libc = { workspace = true }

[target.'cfg(target_os = "linux")'.dependencies]
shards-syscall-filter = { path = "../syscall-filter" }

[target.'cfg(windows)'.dependencies]
shards-afunix = { path = "../afunix" }
windows-sys = { workspace = true, features = [
  "Win32_NetworkManagement_IpHelper",
  "Win32_NetworkManagement_Ndis",
  "Win32_System_Threading",
] }

[dev-dependencies]
shards-testdir = { path = "../testdir" }
# A test's root written as PEM, where a test names it in SSL_CERT_FILE (D242).
rcgen = { version = "0.14.10", default-features = false, features = ["aws_lc_rs", "pem"] }
# The gzip-coded arm of the injector's measurement (#74 step 10 part B), as the image crate codes layers.
flate2 = { version = "1", default-features = false, features = ["zlib-rs", "runtime_detection"] }

[package]
name = "shards-net"
version = "0.1.0"
description = "A microVM's network process: its guest's frames to the host's sockets"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
shards-abi = { path = "../abi" }
shards-dns = { path = "../dns" }
shards-netring = { path = "../netring" }
shards-ipc = { path = "../ipc" }
# The run's CA (D242): rcgen over AWS-LC, as shards-server makes its own (crates/server).
rcgen = { version = "0.14.10", default-features = false, features = ["aws_lc_rs"] }
time = { version = "0.3.55", default-features = false }

[target.'cfg(unix)'.dependencies]
libc = { workspace = true }

[target.'cfg(target_os = "linux")'.dependencies]
shards-syscall-filter = { path = "../syscall-filter" }

[target.'cfg(windows)'.dependencies]
shards-afunix = { path = "../afunix" }
windows-sys = { workspace = true, features = [
  "Win32_NetworkManagement_IpHelper",
  "Win32_NetworkManagement_Ndis",
  "Win32_System_Threading",
] }

[dev-dependencies]
rustls = { version = "0.23.45", default-features = false, features = ["std", "aws_lc_rs"] }
shards-testdir = { path = "../testdir" }

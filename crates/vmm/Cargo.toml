[package]
name = "shards-vmm"
version = "0.1.0"
description = "The shards virtual machine monitor (library)"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[features]
# The GPU's renderer, linked from the libraries scripts/gpu-libs builds (SHARDS_GPU_LIBS):
# `shards-vm-gpu` alone has it (D144, PM M214).
gpu = []

[dependencies]
shards-abi = { path = "../abi" }
shards-netring = { path = "../netring" }

[target.'cfg(unix)'.dependencies]
libc = { workspace = true }
# A share's server hands the VM process a file's descriptor for a DAX window (D189).
shards-ipc = { path = "../ipc" }

[target.'cfg(target_os = "linux")'.dependencies]
shards-syscall-filter = { path = "../syscall-filter" }

[target.'cfg(windows)'.dependencies]
shards-afunix = { path = "../afunix" }
windows-sys = { workspace = true, features = [
  "Wdk_Foundation",
  "Wdk_Storage_FileSystem",
  "Win32_Globalization",
  "Win32_Security",
  "Win32_System_Hypervisor",
  "Win32_System_Ioctl",
  "Win32_System_LibraryLoader",
  "Win32_System_Pipes",
  "Win32_System_ProcessStatus",
  "Win32_System_SystemServices",
  "Win32_System_Threading",
] }

[dev-dependencies]
shards-testdir = { path = "../testdir" }

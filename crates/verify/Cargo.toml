[package]
name = "shards-verify"
version = "0.1.0"
description = "A TLS server's certificate verified as Docker's Go code verifies it (D19): the registry's client's, and the credential injector's upstream (D242)"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
rustls = { version = "0.23.45", default-features = false, features = ["std", "aws_lc_rs"] }

[target.'cfg(target_os = "macos")'.dependencies]
shards-apple = { path = "../apple" }

[target.'cfg(not(target_os = "macos"))'.dependencies]
rustls-platform-verifier = "0.7.1"

# The system's roots read from the directories openssl-probe knows, never from SSL_CERT_FILE
# or SSL_CERT_DIR (Platform, D242): rustls-platform-verifier's own source of them on Linux.
[target.'cfg(target_os = "linux")'.dependencies]
openssl-probe = "0.2.1"
rustls-native-certs = "0.8.4"

[target.'cfg(target_os = "macos")'.dev-dependencies]
# What the macOS verifier is held to: it trusts and refuses as this one did (apple.rs).
rustls-platform-verifier = "0.7.1"

[dev-dependencies]
rcgen = { version = "0.14.10", default-features = false, features = ["aws_lc_rs"] }
time = { version = "0.3.55", default-features = false }

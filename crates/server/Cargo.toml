[package]
name = "shards-server"
version = "0.1.0"
description = "The in-VM server: one instance per agent or harness, outside every domain"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
libc = { workspace = true }

[target.'cfg(target_os = "linux")'.dependencies]
rustls = { version = "0.23.45", default-features = false, features = ["std", "aws_lc_rs"] }
rcgen = { version = "0.14.10", default-features = false, features = ["aws_lc_rs", "pem"] }

[[bin]]
name = "shards-server"
path = "src/main.rs"

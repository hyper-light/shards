[package]
name = "shards-archive"
version = "0.1.0"
description = "Tar archives of files as moby/go-archive makes and unpacks them"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
libc = { workspace = true }

[target.'cfg(windows)'.dependencies]
# A client's context its Windows machine keeps as a Linux tree (`apply_layer_lx`, D180).
shards-ntfs = { path = "../ntfs" }
windows-sys = { workspace = true, features = ["Wdk_Storage_FileSystem"] }

[dev-dependencies]
shards-testdir = { path = "../testdir" }
serde_json = "1"

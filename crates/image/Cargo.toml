[package]
name = "shards-image"
version = "0.1.0"
description = "Images for shards microVMs: EROFS filesystems built from OCI layers"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
shards-erofs = { path = "../erofs" }
flate2 = { version = "1", default-features = false, features = ["zlib-rs", "runtime_detection"] }
regex = "1"
ruzstd = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"

[dev-dependencies]
shards-testdir = { path = "../testdir" }
base64 = "0.23.1"

[target.'cfg(windows)'.dev-dependencies]
windows-sys = { workspace = true, features = ["Win32_Storage_FileSystem"] }

[target.'cfg(target_os = "macos")'.dependencies]
libc = { workspace = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = ["Win32_Foundation", "Win32_System_IO", "Win32_System_Ioctl"] }

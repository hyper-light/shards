[workspace]
resolver = "3"
members = ["crates/abi", "crates/init", "crates/shards", "crates/testguest", "crates/vmm"]
# The guest init only builds for Linux guests; host builds default to the rest.
default-members = ["crates/abi", "crates/shards", "crates/vmm"]

[workspace.package]
edition = "2024"
license = "MIT"
repository = "https://github.com/hyper-light/shards"
rust-version = "1.98"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
undocumented_unsafe_blocks = "warn"
# Production code never panics (CLAUDE.md); clippy.toml exempts tests.
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
panic_in_result_fn = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"
indexing_slicing = "deny"
string_slice = "deny"
print_stdout = "deny"
print_stderr = "deny"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
debug = "line-tables-only"

# Guest binaries: small, fully stripped (they ship inside every microVM).
[profile.guest]
inherits = "release"
opt-level = "s"
debug = false
strip = true

[profile.dev]
panic = "abort"

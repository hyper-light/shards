# Benchmarks on kiln, from the `firecracker` job of .github/workflows/ci.yml: shards against
# Firecracker on one KVM host, the same kernel, initrd and command line, interleaved
# (crates/shards/benches/firecracker.rs), then shards' own restores and pooled runs
# (docs/benchmarks.md). Exclusive on the bench host so nothing else perturbs the measurement.
# Each bench's report (table plus its `shards-bench` JSON line) is kept in bench-results/.
name: bench
on:
  push: { branches: [main] }
  manual: true
env:
  CARGO_TERM_COLOR: always
  TOOLCHAIN: "1.98.0" # keep in sync with rust-toolchain.toml
jobs:
  firecracker:
    name: firecracker comparison (x86_64)
    runs-on: [baremetal, bench]
    exclusive: true
    timeout-minutes: 30
    artifacts: ["bench-results/**"]
    steps:
      - name: Install pinned Rust
        run: rustup toolchain install "$TOOLCHAIN" --profile minimal --target x86_64-unknown-linux-musl
      # GHA runs `sudo chmod 666 /dev/kvm`; this host's /dev/kvm is already open to the agent.
      - name: KVM access
        run: ls -l /dev/kvm && test -r /dev/kvm && test -w /dev/kvm
      - name: Host
        run: |
          mkdir -p bench-results
          {
            nproc && free -m && lscpu | grep -E 'Model name|Virtualization|Hypervisor'
            grep -H . /sys/kernel/mm/transparent_hugepage/{enabled,defrag,hpage_pmd_size}
          } | tee bench-results/host.txt
      - name: Compare
        run: cargo bench --locked -p shards --bench firecracker -- --runs 30 | tee bench-results/firecracker.txt
      - name: Restore
        run: cargo bench --locked -p shards --bench restore -- --runs 30 | tee bench-results/restore.txt
      - name: Image
        run: cargo bench --locked -p shards --bench image -- --runs 100 --templates 5 | tee bench-results/image.txt
      - name: Results (one JSON line per bench)
        run: sed -n 's/^shards-bench //p' bench-results/firecracker.txt bench-results/restore.txt bench-results/image.txt | tee bench-results/results.jsonl

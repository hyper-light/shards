# macOS 15 is the floor: the in-kernel GIC (hv_gic_*) arrived in 15.0. Newer APIs are
# looked up at run time (hv::hvf::ffi).
[env]
MACOSX_DEPLOYMENT_TARGET = "15.0"
# AWS-LC is assembled from source everywhere: aws-lc-sys may not fall back to the
# prebuilt Windows x64 objects it ships, so those builds need NASM (vendor/README.md).
AWS_LC_SYS_PREBUILT_NASM = "0"
# AWS-LC seeds its DRBG from the OS CSPRNG, as BoringSSL and ring do, not from CPU jitter:
# the jitter source costs every new process 17 ms before its first random bytes
# (platform-measurements.md M19, vendor/README.md).
AWS_LC_SYS_NO_JITTER_ENTROPY = "1"

# Hypervisor.framework refuses unentitled processes, so every binary cargo runs on
# macOS (including test harnesses) is ad-hoc signed with the entitlement first.
[target.aarch64-apple-darwin]
runner = "scripts/hvf-run"

[target.x86_64-apple-darwin]
runner = "scripts/hvf-run"

# Guest binaries are static musl executables linked by the LLVM linker Rust ships, so
# no cross toolchain is needed on the build host.
[target.aarch64-unknown-linux-musl]
linker = "rust-lld"

[target.x86_64-unknown-linux-musl]
linker = "rust-lld"

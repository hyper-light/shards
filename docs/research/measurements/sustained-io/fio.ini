; The sustained-I/O benchmark's fio jobs (work.sh), one after another, on SIO_FILE: a file on
; the place's filesystem, or the block device itself, its first 2 GiB. The writes come
; first, so that the reads read what was written. psync alone (Docker's seccomp profile,
; and so shards', refuses io_uring; libaio is a library more): a queue of 32 is 32 jobs.
[global]
filename=${SIO_FILE}
size=2g
ioengine=psync
direct=1
time_based=1
ramp_time=3
runtime=20
group_reporting=1
stonewall

[write-1m]
rw=write
bs=1m

[read-1m]
rw=read
bs=1m

[randread-4k-qd1]
rw=randread
bs=4k

[randread-4k-qd32]
rw=randread
bs=4k
numjobs=32

[randwrite-4k-qd1]
rw=randwrite
bs=4k

[randwrite-4k-qd32]
rw=randwrite
bs=4k
numjobs=32

[write-1m-buffered]
rw=write
bs=1m
direct=0
end_fsync=1

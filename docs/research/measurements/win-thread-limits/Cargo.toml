# What limits how many threads a Windows process may have, and what each thread costs it
# (D181's admission on Windows, PM M529): the host's address space and commit limits, a job's
# limits, a thread's stack reservation and the commit Windows charges for it, the process's
# and the system's, and how many threads a job's process memory limit lets a process start.
[package]
name = "win-thread-limits"
version = "0.1.0"
edition = "2024"
publish = false

[workspace]

[dependencies]
windows-sys = { version = "=0.61.2", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_System_Diagnostics_Debug",
  "Win32_System_JobObjects",
  "Win32_System_Kernel",
  "Win32_System_LibraryLoader",
  "Win32_System_Memory",
  "Win32_System_ProcessStatus",
  "Win32_System_SystemInformation",
  "Win32_System_SystemServices",
  "Win32_System_Threading",
] }

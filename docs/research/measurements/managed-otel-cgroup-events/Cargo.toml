[package]
name = "shards-managed-otel-events-light"
version = "0.0.0"
edition = "2024"
publish = false

[workspace]
members = ["testdir"]
default-members = ["."]

[lib]
path = "../../../../crates/init/src/managed_otel_events_light.rs"

[dependencies]
libc = "=0.2.189"

[dev-dependencies]

# A Windows named pipe as the stream of a share another server serves (PM M340), before the
# virtio-fs device is built on Windows over one: why not AF_UNIX (an abstract address's
# connect), what a pipe pair costs and refuses, the name each of its handles reports, what a
# reader gets after its writer closes or exits, and throughput and latency beside loopback TCP.
[package]
name = "windows-pipe"
version = "0.1.0"
edition = "2024"
publish = false

[workspace]

[dependencies]
windows-sys = { version = "=0.61.2", features = [
  "Win32_Foundation",
  "Win32_Networking_WinSock",
  "Win32_Security",
  "Win32_Storage_FileSystem",
  "Win32_System_IO",
  "Win32_System_Pipes",
  "Win32_System_Threading",
] }

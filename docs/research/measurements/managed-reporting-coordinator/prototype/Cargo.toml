[package]
name = "managed-reporting-prototype"
version = "0.0.0"
edition = "2024"
publish = false

[workspace]

[dependencies]
libc = "=0.2.189"

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
undocumented_unsafe_blocks = "deny"
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
panic_in_result_fn = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"
indexing_slicing = "deny"
string_slice = "deny"
print_stdout = "deny"
print_stderr = "deny"

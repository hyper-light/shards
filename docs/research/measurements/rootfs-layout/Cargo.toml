# Three ways to lay out an image's root filesystem, built from the same layers under the
# same load (beat-Docker 9.1, PM M112): today's (layers unpacked to temporary archives,
# then one EROFS image written from them), one image from layers held in memory, and a
# metadata image with one data blob a layer. Not a workspace member: `run.sh` runs it.
[package]
name = "rootfs-layout"
version = "0.0.0"
edition = "2024"
publish = false

[workspace]

[dependencies]
shards-image = { path = "../../../../crates/image" }
flate2 = { version = "1", default-features = false, features = ["zlib-rs", "runtime_detection"] }
sha2 = "0.11"
serde_json = "1"
libc = "0.2"

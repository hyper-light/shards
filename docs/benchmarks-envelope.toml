# Where shards may, for now, be worse than Firecracker in the comparison CI runs
# (scripts/bench-envelope): each allowance names the metric as bench/metric, why, and the
# date it lapses, after which the check fails until the gap is closed or the allowance
# decided again.

[[allow]]
metric = "firecracker/rss_file"
reason = "0.4 MiB more file-backed memory at boot (ccf5bbc): glibc's pages, which shards-vm maps dynamically and every process on the host shares; the file-backed PSS is 1.4 MiB below Firecracker's"
expires = 2026-12-31

[[allow]]
metric = "firecracker_restore/peak_rss"
reason = "4.4 MiB above Firecracker after a lone restore (ccf5bbc): the snapshot file's pages, in the page cache's large folios. Advice that maps them smaller slows restores 1.3 to 2.3 times (PM M55), and the page cache holds them once for a template's fleet, where each shards VM costs less than Firecracker's on every axis (PM M64)"
expires = 2026-12-31

[[allow]]
metric = "firecracker_restore/rss_file"
reason = "8.7 MiB more of the snapshot's memory file resident after a lone restore (ccf5bbc), with 4.3 MiB less anonymous memory: shared page cache, as for peak_rss (PM M55, M64)"
expires = 2026-12-31

[[allow]]
metric = "firecracker_restore/pss"
reason = "2.6 MiB above Firecracker's PSS after a lone restore (ccf5bbc), the memory file's pages, which a fleet shares: 16 VMs held at once cost 1.9 MiB of PSS each against Firecracker's 5.7 (PM M64)"
expires = 2026-12-31

[[allow]]
metric = "firecracker_restore/pss_file"
reason = "6.9 MiB more of the memory file after a lone restore (ccf5bbc), shared by a fleet as for pss (PM M55, M64)"
expires = 2026-12-31

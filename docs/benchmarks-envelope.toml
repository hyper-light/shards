# Where shards may, for now, be worse than Firecracker in the comparison CI runs
# (scripts/bench-envelope): each allowance names the metric as bench/metric, why, and the
# date it lapses, after which the check fails until the gap is closed or the allowance
# decided again.

[[allow]]
metric = "firecracker/peak_rss"
reason = "0.3 MiB above Firecracker at boot (ccf5bbc), all of it glibc's pages, which shards-vm maps dynamically and every process on the host shares: its PSS is 1.4 MiB below Firecracker's, its file-backed PSS 0.8 against 2.2 MiB"
expires = 2026-12-31

[[allow]]
metric = "firecracker/rss_file"
reason = "0.4 MiB more file-backed memory at boot (ccf5bbc): glibc's shared pages, as above; the file-backed PSS is 1.4 MiB below Firecracker's"
expires = 2026-12-31

[[allow]]
metric = "firecracker_restore/peak_rss"
reason = "4.4 MiB above Firecracker after a restore (ccf5bbc): the snapshot's memory file, 19 MB resident against 10 MB; which advice keeps it smaller is docs/research/measurements/restore-advice"
expires = 2026-10-31

[[allow]]
metric = "firecracker_restore/rss_file"
reason = "8.7 MiB more of the snapshot's memory file resident (ccf5bbc), with 4.3 MiB less anonymous memory; docs/research/measurements/restore-advice"
expires = 2026-10-31

[[allow]]
metric = "firecracker_restore/pss"
reason = "2.6 MiB above Firecracker's PSS after a restore (ccf5bbc), the memory file's pages; docs/research/measurements/restore-advice"
expires = 2026-10-31

[[allow]]
metric = "firecracker_restore/pss_file"
reason = "6.9 MiB more of the memory file (ccf5bbc); docs/research/measurements/restore-advice"
expires = 2026-10-31

<svg xmlns="http://www.w3.org/2000/svg" width="84" height="90" viewBox="2 1 28 30" role="img" aria-labelledby="title desc">
  <title id="title">Shards logo</title>
  <desc id="desc">Three faceted shards floating apart at different heights, each with a solid face, a lighter face and a glint.</desc>
  <!-- The geometry is the shards project mark on hyperlight-site
       (components/project-mark.tsx), on its 32-unit grid. Each shard is drawn whole at
       55% ink, then its solid face on top, so the ridge between the faces has no seam.
       A vector mask cuts the glints 0.45 units wide. Every contour is straight. -->
  <defs>
    <mask id="glints" maskUnits="userSpaceOnUse" x="0" y="0" width="32" height="32">
      <path d="M 0 0 H 32 V 32 H 0 Z" fill="#ffffff"/>
      <path d="M 15 10 L 17 13 M 5 17 L 7 19 M 23 21 L 25 23" fill="none" stroke="#000000" stroke-width="0.45" stroke-linecap="round"/>
    </mask>
  </defs>
  <g fill="#1f2328" mask="url(#glints)">
    <g fill-opacity="0.55">
      <path d="M 14 6 L 19 2 L 21 12 L 16 19 L 12 14 Z"/>
      <path d="M 3 14 L 9 9 L 11 18 L 7 26 L 4 20 Z"/>
      <path d="M 23 17 L 29 11 L 27 25 L 22 30 L 21 23 Z"/>
    </g>
    <path d="M 19 2 L 14 6 L 12 14 L 16 19 L 16 12 Z"/>
    <path d="M 9 9 L 3 14 L 4 20 L 7 26 L 6 18 Z"/>
    <path d="M 29 11 L 23 17 L 21 23 L 22 30 L 24 23 Z"/>
  </g>
</svg>

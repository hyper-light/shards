name: whp probe

# Whether GitHub's Windows runners can run a VM under the Windows Hypervisor Platform:
# what a WHP backend of shards' VMM could be tested on, for
# docs/research/measurements/whp-probe. Runs when the probe changes, or when asked.
on:
  push:
    paths:
      - docs/research/measurements/whp-probe/**
      - .github/workflows/whp-probe.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        runner: [windows-2022, windows-2025, windows-11-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Probe
        shell: pwsh
        run: docs/research/measurements/whp-probe/probe.ps1

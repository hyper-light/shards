name: windows lower

# D191's Windows priority governor, A/B (PM M620): arm A as it is, counting each watched
# thread's CPU in GetThreadTimes' steps at a period of 2g; arm B (win-lower/arm-b-cycles.patch)
# counting it in cycles at the time stamp counter's rate, its period from its waits alone. Each
# arm in turn, twice, on both Windows Server runners: the sampling harness alone and beside
# three busy threads (the three's share of the window's counter ticks, the governor's pool
# account and its looks' own time), and the bound's test five times. Runs when it changes, or
# when asked.
on:
  push:
    paths:
      - .github/workflows/windows-lower.yml
      - docs/research/measurements/win-lower/**
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: never
  TOOLCHAIN: 1.98.1 # keep in sync with rust-toolchain.toml

jobs:
  ab:
    strategy:
      fail-fast: false
      matrix:
        runner: [windows-2022, windows-2025]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Install pinned Rust
        shell: bash
        run: scripts/retry 5 30 rustup toolchain install "$TOOLCHAIN" --profile minimal
      - name: Host
        shell: pwsh
        run: |
          [Environment]::ProcessorCount
          (Get-CimInstance Win32_Processor).Name
          [System.Environment]::OSVersion.VersionString
      - name: A and B in turn, twice
        shell: bash
        run: |
          set -u
          harness=docs/research/measurements/win-lower/governor
          bound=platform::windows_thread::tests::raised_threads_sharing_a_cpu_take_no_more_than_half_of_it
          echo "$(git rev-parse --short HEAD) on ${{ matrix.runner }}"
          for round in 1 2; do
            for arm in A B; do
              if [ "$arm" = B ]; then git apply docs/research/measurements/win-lower/arm-b-cycles.patch; fi
              cargo build --release --manifest-path "$harness/Cargo.toml" 2>&1 | tail -1
              cargo test --locked --profile test-release -p shards-vmm --lib --no-run 2>&1 | tail -1
              for load in 0 3; do
                echo "=== arm $arm round $round, the harness beside $load busy threads"
                "$harness/target/release/win-governor.exe" 5 3 "$load" \
                  | grep -E "\| [0-9] \||governor's (pool|looks)" || true
              done
              echo "=== arm $arm round $round, the bound's test five times"
              for i in 1 2 3 4 5; do
                cargo test --locked --profile test-release -p shards-vmm --lib -- --exact "$bound" 2>&1 \
                  | grep -E "^test result|past their bound" || true
              done
              git checkout -- crates
            done
          done

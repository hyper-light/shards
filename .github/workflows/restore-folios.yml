name: restore folios

# Whether the way shards writes and maps a snapshot's memory file (a page a write on
# Linux) keeps a restored guest's memory small where Linux maps a page cache folio whole
# on a read fault (6.18 and later: mm/filemap.c, filemap_map_folio_range), warm and with
# the file dropped from the page cache, and what it costs a restore
# (docs/research/measurements/restore-folios). Runs when the experiment changes, or when
# asked.
on:
  push:
    paths:
      - docs/research/measurements/restore-folios/**
      - .github/workflows/restore-folios.yml
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  TOOLCHAIN: 1.98.1 # keep in sync with rust-toolchain.toml

jobs:
  compare:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v7.0.1
      - run: scripts/retry 5 30 rustup toolchain install "$TOOLCHAIN" --profile minimal --target x86_64-unknown-linux-musl
      - run: scripts/install-zig
      - run: sudo chmod 666 /dev/kvm
      - run: git apply docs/research/measurements/restore-folios/folios.patch
      - name: Each arm, the Firecracker comparison
        run: |
          uname -r
          grep -H . /sys/kernel/mm/transparent_hugepage/{enabled,defrag} || true
          for at in target /tmp "$RUNNER_TEMP"; do echo "$at: $(findmnt -no FSTYPE -T "$at" || true)"; done
          cat /sys/kernel/mm/transparent_hugepage/hugepages-*/enabled 2>/dev/null | sort | uniq -c || true
          # shipped: as shards is (a page a write on Linux); random: its restores mapped
          # MADV_RANDOM; whole: runs written whole, as before the fix (the control); evict:
          # the file dropped from the page cache before each restore maps it, as a busy host
          # drops it; evict-random: both.
          arms() {
            case $1 in
              random) echo "SHARDS_RESTORE_RANDOM=1" ;;
              whole) echo "SHARDS_SAVE_WHOLE=1" ;;
              evict) echo "SHARDS_RESTORE_EVICT=1" ;;
              evict-random) echo "SHARDS_RESTORE_EVICT=1 SHARDS_RESTORE_RANDOM=1" ;;
            esac
          }
          # Each arm's whole output is kept: its rows printed, or its tail where it fails,
          # so that one arm's failure neither hides its error nor stops the others.
          for round in 1 2; do
            for arm in shipped random whole evict evict-random; do
              vars="SHARDS_WS_LOG=$RUNNER_TEMP/ws-$arm.log $(arms $arm)"
              echo "=== round $round, $arm: $vars"
              out="$RUNNER_TEMP/compare-$round-$arm.log"
              if env $vars cargo bench --locked -p shards --bench firecracker -- --runs 20 > "$out" 2>&1; then
                awk '/^firecracker(_restore|_density)?:/ || /^(shards|fc)_(to_ready|to_beat|overhead|peak_rss|rss_file|pss_file|pss|rss_anon|fleet_pss|fleet_private|fleet_host) / || /mappings by resident bytes/ || /^  rss .*memory$/' "$out"
              else
                echo "--- $arm FAILED (exit $?), its last lines:"
                tail -40 "$out"
              fi
            done
          done
          for arm in shipped random whole evict evict-random; do
            if [ -s "$RUNNER_TEMP/ws-$arm.log" ]; then
              echo "--- $arm's working sets"
              sort "$RUNNER_TEMP/ws-$arm.log" | uniq -c | sort -rn | head -8
            fi
          done
      # Where a run's time is: cold restores, warm requests and runs served from a
      # template's pool; the arms alternating, three rounds.
      - name: Warm requests and pooled runs, each arm
        run: |
          arms() {
            case $1 in
              random) echo "SHARDS_RESTORE_RANDOM=1" ;;
              whole) echo "SHARDS_SAVE_WHOLE=1" ;;
              evict) echo "SHARDS_RESTORE_EVICT=1" ;;
              evict-random) echo "SHARDS_RESTORE_EVICT=1 SHARDS_RESTORE_RANDOM=1" ;;
            esac
          }
          for round in 1 2 3; do
            for arm in shipped random whole evict evict-random; do
              vars="SHARDS_WS_LOG=$RUNNER_TEMP/ws-bench-$arm.log $(arms $arm)"
              echo "=== round $round, $arm: $vars"
              for bench in "restore -- --runs 30" "image -- --runs 60 --templates 3"; do
                out="$RUNNER_TEMP/bench-$round-$arm-${bench%% *}.log"
                if env $vars cargo bench --locked -p shards --bench $bench > "$out" 2>&1; then
                  grep -E '^(cold_restore|cold_spawn_exit|warm_request|warm_peak_rss|run_template|template_command|template_outside|run_template_rss) ' "$out" || true
                else
                  echo "--- $arm ${bench%% *} FAILED (exit $?), its last lines:"
                  tail -40 "$out"
                fi
              done
            done
          done
          for arm in shipped random whole evict evict-random; do
            if [ -s "$RUNNER_TEMP/ws-bench-$arm.log" ]; then
              echo "--- $arm's working sets (benches)"
              sort "$RUNNER_TEMP/ws-bench-$arm.log" | uniq -c | sort -rn | head -8
            fi
          done

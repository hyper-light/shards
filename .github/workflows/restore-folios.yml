name: restore folios

# Which way of writing and mapping a snapshot's memory file keeps a restored guest's
# memory small where Linux maps a page cache folio whole on a read fault (6.18 and later:
# mm/filemap.c, filemap_map_folio_range), without slowing its first beat
# (docs/research/measurements/restore-folios). Runs when the experiment changes, or when
# asked.
on:
  push:
    paths:
      - docs/research/measurements/restore-folios/**
      - .github/workflows/restore-folios.yml
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  TOOLCHAIN: 1.98.1 # keep in sync with rust-toolchain.toml

jobs:
  compare:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v7.0.1
      - run: scripts/retry 5 30 rustup toolchain install "$TOOLCHAIN" --profile minimal --target x86_64-unknown-linux-musl
      - run: scripts/install-zig
      - run: sudo chmod 666 /dev/kvm
      - run: git apply docs/research/measurements/restore-folios/folios.patch
      - name: Each arm, the Firecracker comparison
        run: |
          uname -r
          grep -H . /sys/kernel/mm/transparent_hugepage/{enabled,defrag} || true
          findmnt -no FSTYPE -T target || true
          cat /sys/kernel/mm/transparent_hugepage/hugepages-*/enabled 2>/dev/null | sort | uniq -c || true
          for arm in base random pagewise drop; do
            vars="SHARDS_WS_LOG=$RUNNER_TEMP/ws-$arm.log"
            case $arm in
              random) vars="$vars SHARDS_RESTORE_RANDOM=1" ;;
              pagewise) vars="$vars SHARDS_SAVE_PAGEWISE=1 SHARDS_RESTORE_RANDOM=1" ;;
              drop) vars="$vars SHARDS_SAVE_DROP=1 SHARDS_RESTORE_RANDOM=1" ;;
            esac
            echo "=== $arm: $vars"
            env $vars cargo bench --locked -p shards --bench firecracker -- --runs 20 2>&1 |
              awk '/^firecracker(_restore|_density)?:/ || /^(shards|fc)_(to_ready|to_beat|overhead|peak_rss|rss_file|pss_file|pss|rss_anon|fleet_pss|fleet_private|fleet_host) / || /mappings by resident bytes/ || /^  rss .*memory$/'
            # Working sets only where a recording restore wrote them (the daemon path, not
            # the bench's cold restores): reported if present, never failing the step.
            if [ -s "$RUNNER_TEMP/ws-$arm.log" ]; then
              echo "--- $arm's working sets"
              sort "$RUNNER_TEMP/ws-$arm.log" | uniq -c | sort -rn | head -8
            fi
          done
      # Where a run's time is: warm requests, and runs served from a template's pool;
      # the arms alternating, twice each.
      - name: Warm requests and pooled runs, each arm
        run: |
          for round in 1 2; do
            for arm in base pagewise drop; do
              vars="SHARDS_WS_LOG=$RUNNER_TEMP/ws-bench-$arm.log"
              case $arm in
                pagewise) vars="$vars SHARDS_SAVE_PAGEWISE=1 SHARDS_RESTORE_RANDOM=1" ;;
                drop) vars="$vars SHARDS_SAVE_DROP=1 SHARDS_RESTORE_RANDOM=1" ;;
              esac
              echo "=== round $round, $arm: $vars"
              env $vars cargo bench --locked -p shards --bench restore -- --runs 30 2>&1 |
                grep -E '^(cold_restore|cold_spawn_exit|warm_request|warm_peak_rss) '
              env $vars cargo bench --locked -p shards --bench image -- --runs 60 --templates 3 2>&1 |
                grep -E '^(run_template|template_command|template_outside|run_template_rss) '
            done
          done

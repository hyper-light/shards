name: whp run

# WHP partitions run on GitHub's Windows runners (docs/research/measurements/whp-run): what
# the hypervisor offers, what a guest sees of it, and what an exit costs (PM M197); an AP's
# start, interrupts, register access, doorbells and cancels (PM M198); a partition run from
# an AppContainer (PM M200); the VM process confined as shards would confine it (PM M201);
# dynamic code forbidden once a partition is set up (PM M202); sockets and files a confined VM
# process is handed (PM M203); what a confined network process may reach, and its doorbells
# (PM M204); the CPUID a partition's vCPUs see, and what a VMM may change of it (PM M206);
# the environment a child in an AppContainer must be given, and what it has (PM M208); what
# waking a network process's loop costs, by how it waits (PM M213); what changing a socket's
# registration with a completion port does (PM M215); a DAX window's ranges, views of a
# section placed into a placeholder reservation and mapped at stage 2, and what replacing one
# costs (PM M341); a section handed to a confined VM process by a process that did not spawn
# it, as the runner's account and as a standard user (PM M343); what a partition's snapshot
# rests on: its vCPU's state, its time held and set, and a restore's RAM a copy-on-write view of
# a sparse file, and the renames its commit makes, which Windows may refuse (PM M345); a group
# of VM processes in a job of its own (PM M359). Runs when the probes change, or when asked.
on:
  push:
    paths:
      - docs/research/measurements/whp-run/**
      - .github/workflows/whp-run.yml
  workflow_dispatch:

permissions:
  contents: read

env:
  TOOLCHAIN: "1.98.1"

jobs:
  run:
    strategy:
      fail-fast: false
      matrix:
        runner: [windows-2022, windows-2025]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Install pinned Rust
        shell: bash
        run: rustup toolchain install "$TOOLCHAIN" --profile minimal --target x86_64-pc-windows-msvc
      - name: Host
        shell: pwsh
        run: |
          (Get-CimInstance Win32_Processor).Name
          [System.Environment]::OSVersion.VersionString
      - name: M197
        shell: bash
        working-directory: docs/research/measurements/whp-run
        run: cargo run --release --bin whp-run
      - name: M198
        if: ${{ !cancelled() }}
        shell: bash
        working-directory: docs/research/measurements/whp-run
        run: cargo run --release --bin m198
      # A standard user, as the runner's own is an administrator: a throwaway account of
      # this runner's alone, its password made here and never shown.
      - name: M200
        if: ${{ !cancelled() }}
        shell: pwsh
        working-directory: docs/research/measurements/whp-run
        run: |
          $chars = [char[]]'abcdefghijkmnopqrstuvwxyzABCDEFGHJKLMNPQRSTUVWXYZ23456789'
          $p = -join (1..24 | ForEach-Object { $chars[(Get-Random -Maximum $chars.Length)] }) + '!7a'
          New-LocalUser -Name shards-probe -Password (ConvertTo-SecureString $p -AsPlainText -Force) | Out-Null
          $env:SHARDS_PROBE_USER = 'shards-probe'
          $env:SHARDS_PROBE_PASSWORD = $p
          cargo run --release --bin m200
          Remove-LocalUser -Name shards-probe
      - name: M201
        if: ${{ !cancelled() }}
        shell: bash
        working-directory: docs/research/measurements/whp-run
        run: cargo run --release --bin m201
      - name: M202
        if: ${{ !cancelled() }}
        shell: bash
        working-directory: docs/research/measurements/whp-run
        run: cargo run --release --bin m202
      - name: M203
        if: ${{ !cancelled() }}
        shell: bash
        working-directory: docs/research/measurements/whp-run
        run: cargo run --release --bin m203
      - name: M204
        if: ${{ !cancelled() }}
        shell: bash
        working-directory: docs/research/measurements/whp-run
        run: cargo run --release --bin m204
      - name: M206
        if: ${{ !cancelled() }}
        shell: bash
        working-directory: docs/research/measurements/whp-run
        run: cargo run --release --bin m206
      - name: M208
        if: ${{ !cancelled() }}
        shell: bash
        working-directory: docs/research/measurements/whp-run
        run: cargo run --release --bin m208
      # Before M213, whose 10,000 idle sockets take most of the job's time.
      - name: M341
        if: ${{ !cancelled() }}
        shell: bash
        working-directory: docs/research/measurements/whp-run
        run: cargo run --release --bin m341
      # A section handed to the VM process by a process that did not spawn it (PM M343), tried
      # again as a standard user as M200 runs one: a server such as slates' daemon runs as one, and
      # the runner's own account is an administrator.
      - name: M343
        if: ${{ !cancelled() }}
        shell: pwsh
        working-directory: docs/research/measurements/whp-run
        run: |
          $chars = [char[]]'abcdefghijkmnopqrstuvwxyzABCDEFGHJKLMNPQRSTUVWXYZ23456789'
          $p = -join (1..24 | ForEach-Object { $chars[(Get-Random -Maximum $chars.Length)] }) + '!7a'
          New-LocalUser -Name shards-m343 -Password (ConvertTo-SecureString $p -AsPlainText -Force) | Out-Null
          $env:SHARDS_PROBE_USER = 'shards-m343'
          $env:SHARDS_PROBE_PASSWORD = $p
          cargo run --release --bin m343
          Remove-LocalUser -Name shards-m343
      # Before M213 too, which ran the job past 50 minutes before them (run 40505676815).
      - name: M345
        if: ${{ !cancelled() }}
        shell: bash
        working-directory: docs/research/measurements/whp-run
        run: cargo run --release --bin m345 -- "$RUNNER_TEMP/m345"
      # The renames a snapshot's commit makes, beside what Microsoft Defender's real-time
      # protection is on this runner: on jupiter, with it on, some were refused for a minute.
      - name: M345, renames
        if: ${{ !cancelled() }}
        timeout-minutes: 20
        shell: pwsh
        working-directory: docs/research/measurements/whp-run
        run: |
          Get-MpComputerStatus -ErrorAction SilentlyContinue |
            Select-Object AMRunningMode, RealTimeProtectionEnabled, OnAccessProtectionEnabled | Format-List
          cargo run --release --bin m345_rename -- "$env:RUNNER_TEMP\m345-rename"
      - name: M215
        if: ${{ !cancelled() }}
        shell: bash
        working-directory: docs/research/measurements/whp-run
        run: cargo run --release --bin m215
      - name: M213
        if: ${{ !cancelled() }}
        shell: bash
        working-directory: docs/research/measurements/whp-run
        run: cargo run --release --bin m213
      - name: M359
        if: ${{ !cancelled() }}
        shell: bash
        working-directory: docs/research/measurements/whp-run
        run: cargo run --release --bin m359

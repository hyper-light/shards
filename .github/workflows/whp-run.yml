name: whp run

# A WHP partition run on GitHub's Windows runners (docs/research/measurements/whp-run, PM
# M197): what the hypervisor offers, what a guest sees of it, and what an exit costs.
# Runs when the probe changes, or when asked.
on:
  push:
    paths:
      - docs/research/measurements/whp-run/**
      - .github/workflows/whp-run.yml
  workflow_dispatch:

permissions:
  contents: read

env:
  TOOLCHAIN: "1.98.0"

jobs:
  run:
    strategy:
      fail-fast: false
      matrix:
        runner: [windows-2022, windows-2025]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Install pinned Rust
        shell: bash
        run: rustup toolchain install "$TOOLCHAIN" --profile minimal --target x86_64-pc-windows-msvc
      - name: Host
        shell: pwsh
        run: |
          (Get-CimInstance Win32_Processor).Name
          [System.Environment]::OSVersion.VersionString
      - name: Run
        shell: bash
        working-directory: docs/research/measurements/whp-run
        run: cargo run --release

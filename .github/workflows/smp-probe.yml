# Scratch (not for dev): why multi-vCPU guests stall at "smpboot: x86: Booting SMP
# configuration:" in a confined VM process on Windows Server 2022 (build 20348), where the
# unconfined control (boot.rs two_vcpus_boot_to_their_end_in_this_process) brings both up,
# and why every daemon-started VM there ends 137 before READY. Each job builds the same
# tree, the second with its VM process never forbidding itself dynamic code (D141's ACG):
# whatever differs between them is ACG's.
name: smp probe
on:
  push:
    branches: [ci-smp-probe]
env:
  CARGO_TERM_COLOR: never
  TOOLCHAIN: 1.98.1
jobs:
  probe:
    name: windows-2022 alone and together
    runs-on: windows-2022
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Install pinned Rust
        shell: bash
        run: |
          scripts/retry 5 30 rustup toolchain install "$TOOLCHAIN" --profile minimal \
            --target x86_64-pc-windows-msvc --target x86_64-unknown-linux-musl --target aarch64-unknown-linux-musl
      - name: zig
        shell: bash
        run: scripts/install-zig
      - name: NASM
        shell: bash
        run: |
          curl -fsSL --retry 5 --retry-all-errors --retry-delay 10 -o "$RUNNER_TEMP/nasm.zip" https://www.nasm.us/pub/nasm/releasebuilds/3.02/win64/nasm-3.02-win64.zip
          echo "161d0bfaff53c2f9e9f3e69fd0672323ebabafd1268976a5cec11be92a19aee7  $RUNNER_TEMP/nasm.zip" | sha256sum -c
          unzip -q "$RUNNER_TEMP/nasm.zip" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/nasm-3.02" >> "$GITHUB_PATH"
      - name: Build
        shell: bash
        run: cargo test --locked -p shards --profile test-release --test boot --test daemon --no-run
      - name: The runner
        shell: bash
        run: |
          echo "NUMBER_OF_PROCESSORS=$NUMBER_OF_PROCESSORS"
          powershell -NoProfile -Command "Get-CimInstance Win32_ComputerSystem | Select-Object NumberOfProcessors,NumberOfLogicalProcessors,TotalPhysicalMemory | Format-List; Get-CimInstance Win32_OperatingSystem | Select-Object Caption,BuildNumber | Format-List" || true
      - name: Each alone, then together, then one at a time
        shell: bash
        run: |
          export SHARDS_REQUIRE_VMS=1
          run() {
            echo "=== $1"
            shift
            start=$(date +%s)
            cargo test --locked -p shards --profile test-release "$@" 2>&1 | grep -a -E "PROBE max|^test |test result|Brought up|Booting SMP|smpboot|did not exit|panicked|137|status" | grep -a -v JOBMSG | cut -c1-400 | head -40 || true
            echo "--- $(( $(date +%s) - start )) s"
          }
          for i in 1 2 3; do run "maximum alone $i" --test boot -- --exact boots_the_hosts_maximum_vcpu_count --nocapture; done
          for i in 1 2; do run "every vcpu alone $i" --test boot -- --exact brings_up_every_vcpu; done
          for i in 1 2 3; do run "the pair together $i" --test boot -- --exact brings_up_every_vcpu boots_the_hosts_maximum_vcpu_count; done
          run "the pair one at a time" --test boot -- --exact brings_up_every_vcpu boots_the_hosts_maximum_vcpu_count --test-threads=1
          for i in 1 2; do run "a daemon test alone $i" --test daemon -- --exact errors_reach_the_client; done
          run "two daemon tests together" --test daemon -- --exact errors_reach_the_client idle_daemons_exit

# Scratch (not for dev): why multi-vCPU guests stall at "smpboot: x86: Booting SMP
# configuration:" in a confined VM process on Windows Server 2022 (build 20348), where the
# unconfined control (boot.rs two_vcpus_boot_to_their_end_in_this_process) brings both up,
# and why every daemon-started VM there ends 137 before READY. Each job builds the same
# tree, the second with its VM process never forbidding itself dynamic code (D141's ACG):
# whatever differs between them is ACG's.
name: smp probe
on:
  push:
    branches: [ci-smp-probe]
env:
  CARGO_TERM_COLOR: never
  TOOLCHAIN: 1.98.1
jobs:
  probe:
    name: windows-2022 ${{ matrix.variant }}
    runs-on: windows-2022
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        # What the confined VM process is made with, one thing taken away each (ipc
        # windows.rs spawn_suspended): its mitigations, Win32k's alone, its job's
        # one-process limit, its AppContainer. ACG was ruled out by the first probe.
        variant: [no-mitigations, no-win32k, no-job-limit, no-appcontainer]
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Install pinned Rust
        shell: bash
        run: |
          scripts/retry 5 30 rustup toolchain install "$TOOLCHAIN" --profile minimal \
            --target x86_64-pc-windows-msvc --target x86_64-unknown-linux-musl --target aarch64-unknown-linux-musl
      - name: zig
        shell: bash
        run: scripts/install-zig
      - name: NASM
        shell: bash
        run: |
          curl -fsSL --retry 5 --retry-all-errors --retry-delay 10 -o "$RUNNER_TEMP/nasm.zip" https://www.nasm.us/pub/nasm/releasebuilds/3.02/win64/nasm-3.02-win64.zip
          echo "161d0bfaff53c2f9e9f3e69fd0672323ebabafd1268976a5cec11be92a19aee7  $RUNNER_TEMP/nasm.zip" | sha256sum -c
          unzip -q "$RUNNER_TEMP/nasm.zip" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/nasm-3.02" >> "$GITHUB_PATH"
      - name: The variant
        shell: bash
        run: |
          f=crates/ipc/src/windows.rs
          case "${{ matrix.variant }}" in
            no-mitigations) sed -i 's/^const MITIGATIONS: \[u64; 2\] = .*/const MITIGATIONS: [u64; 2] = [0, 0];/' $f ;;
            no-win32k) sed -i 's/^const MITIGATIONS: \[u64; 2\] = \[(1 << 24) | (1 << 28) | /const MITIGATIONS: [u64; 2] = [(1 << 24) | /' $f ;;
            no-job-limit) sed -i 's/JOB_OBJECT_LIMIT_KILL_ON_JOB_CLOSE | JOB_OBJECT_LIMIT_ACTIVE_PROCESS;/JOB_OBJECT_LIMIT_KILL_ON_JOB_CLOSE;/' $f ;;
            no-appcontainer) sed -i 's/AppContainerSid: s.container.map_or(std::ptr::null_mut(), |c| c.sid.0),/AppContainerSid: std::ptr::null_mut(),/' $f ;;
          esac
          git diff --stat; git diff | grep "^[-+][^-+]" | head -6
      - name: Build
        shell: bash
        run: cargo test --locked -p shards --profile test-release --test boot --no-run
      - name: Two vCPUs, confined
        shell: bash
        run: |
          export SHARDS_REQUIRE_VMS=1
          cargo test --locked -p shards --profile test-release --test boot -- --exact brings_up_every_vcpu 2>&1 | grep -a -v -E "^\s*(Compiling|Finished|Running)|aws-lc|^warning" | grep -a -E "test |Brought up|Booting SMP|panicked|did not exit|^--- |shards:|error|Error|WHv|failed|HRESULT|0x8" | cut -c1-300 | head -60 || true

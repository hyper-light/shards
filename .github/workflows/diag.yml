# Diagnostic (branch kvm-ws-diag, temporary): KVM's counters between the phases of pooled
# runs, with and without the template's working set, alternating on one host.
name: diag

on:
  push:
    branches: [kvm-ws-diag]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  TOOLCHAIN: 1.98.0

jobs:
  phases:
    strategy:
      fail-fast: false
      matrix:
        runner: [1, 2, 3]
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Install pinned Rust
        run: rustup toolchain install "$TOOLCHAIN" --profile minimal --target x86_64-unknown-linux-musl
      - name: KVM access
        run: sudo chmod 666 /dev/kvm
      - name: Host
        run: lscpu | grep -E 'Model name|Hypervisor'
      - name: The build, and the kernel and guest init the tests use
        run: |
          cargo build --locked --release -p shards
          cargo bench --locked -p shards --bench image -- --runs 1 --templates 1
      - name: Phases, with and without the working set
        run: |
          set -eu
          kernel=$(ls target/artifacts/vmlinux-6.18.48-x86_64* | head -1)
          init=target/guest/x86_64-unknown-linux-musl/guest/shards-init
          shards=$PWD/target/release/shards
          ab=$RUNNER_TEMP/ab
          mkdir -p $ab
          new=$ab/new old=$ab/old
          SHARDS_HOME=$new $shards pull -q alpine
          SHARDS_HOME=$new $shards guest use --kernel $kernel --init $init
          SHARDS_HOME=$new $shards run --pull never alpine true
          for i in $(seq 100); do ls $new/templates/*/working-set >/dev/null 2>&1 && break; sleep 0.1; done
          SHARDS_HOME=$new $shards daemon stop
          cp -a $new $old
          rm $old/templates/*/working-set
          for i in $(seq 40); do
            for arm in new old; do
              SHARDS_HOME=$ab/$arm SHARDS_KVM_STATS=$ab/$arm.log $shards run --pull never alpine true
              sleep 0.02
            done
          done
          for arm in new old; do SHARDS_HOME=$ab/$arm $shards daemon stop; done
          # Where the request's pages were: in the working set the template recorded?
          python3 - $new/templates/*/working-set $ab/old.log $ab/new.log <<'PY'
          import glob, struct, sys, statistics
          raw = open(sys.argv[1], "rb").read()
          at = 12
          (alen,) = struct.unpack_from("<I", raw, at); at += 4 + alen + 8
          (n,) = struct.unpack_from("<I", raw, at); at += 4
          ws = {}
          for i in range(n):
              (v,) = struct.unpack_from("<Q", raw, at + 8 * i)
              ws[v & ~0xfff] = bool(v & 1)
          print(f"working set: {len(ws)} pages, {sum(ws.values())} written")
          for log in sys.argv[2:]:
              stats = {"request": [], "in_ws": [], "written": [], "written_in_ws_as_written": []}
              for req in glob.glob(log + ".*.request"):
                  ans = req[: -len("request")] + "answered"
                  try:
                      before = {int(l.split()[0], 16) for l in open(req)}
                      after = {int(l.split()[0], 16): l.strip().endswith(" w") for l in open(ans)}
                  except OSError:
                      continue
                  new_pages = {p: w for p, w in after.items() if p not in before}
                  written = [p for p, w in new_pages.items() if w]
                  stats["request"].append(len(new_pages))
                  stats["in_ws"].append(sum(p in ws for p in new_pages))
                  stats["written"].append(len(written))
                  stats["written_in_ws_as_written"].append(sum(ws.get(p, False) for p in written))
              print(f"== {log}: {len(stats['request'])} VMs")
              for k, v in stats.items():
                  if v:
                      print(f"  {k:26} median {statistics.median(v):>6.0f}  min {min(v):>6}  max {max(v):>6}")
          PY
          python3 - $ab/old.log $ab/new.log <<'PY'
          import re, sys, statistics
          keys = ["pf_taken", "pf_fixed", "exits", "io_exits", "mmio_exits", "halt_exits",
                  "irq_exits", "irq_window_exits", "insn_emulation", "irq_injections",
                  "remote_tlb_flush", "tlb_flush", "halt_wait_ns", "signal_exits",
                  "request_irq_exits", "nmi_window_exits", "pages_4k", "preemption_reported"]
          for path in sys.argv[1:]:
              runs = {}
              for line in open(path):
                  m = re.match(r"(\d+) (\d+)us kvm-phase (\w+) (.*)", line)
                  if not m:
                      continue
                  pid, us, label, rest = m.groups()
                  stats = dict(kv.split("=") for kv in rest.split())
                  stats = {k: int(v) for k, v in stats.items()}
                  stats["us"] = int(us)
                  runs.setdefault(pid, {})[label] = stats
              print(f"== {path}: {len(runs)} runs")
              for a, b in (("request", "started"), ("started", "answered"), ("request", "answered")):
                  print(f"  {a} -> {b}:")
                  for k in ["us"] + keys:
                      d = [r[b].get(k, 0) - r[a].get(k, 0) for r in runs.values() if a in r and b in r]
                      if d and any(d):
                          print(f"    {k:20} median {statistics.median(d):>10.0f}  max {max(d):>10}")
          PY

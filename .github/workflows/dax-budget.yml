name: DAX budget

# What a microVM held to a budget pays to read a file through its volume's DAX window, on
# CI's runners (D188, D189): docs/research/measurements/dax-budget/measure.py, its samples
# and profiles kept as the run's artifact; x86_64 alone, as hosted arm64 runners have no
# /dev/kvm. Runs when the experiment changes, or when asked. The experiment now: a run
# alone in its slice (a pool of none) held under a budget a mebibyte short of what it holds
# (`short`), where on an EPYC 7763 the FUSE budget E2E's reads took 2.3 times their time
# with none, its slice taking back its guest's RAM (its template's mapped pages, 67 MiB to
# 15) beside 213 MiB of the share's copy of what it read: with the tree, and with the share
# dropping its copy of each range its guest has read (share-dontneed.patch), beside the
# same reads with no budget, on eight runners at once. pcp-small.patch holds each CPU's
# lists of free pages in its guest to their least, least-x*.patch give the tree's least
# room 2 to 16 times over, ws-reads.patch a pool under a budget mapping ahead none of the
# pages its working set's guest wrote, and --as-e2e the FUSE budget E2E's phases, where
# asked.
on:
  push:
    paths:
      - docs/research/measurements/dax-budget/**
      - .github/workflows/dax-budget.yml
  workflow_dispatch:
    inputs:
      args:
        description: measure.py's arguments, after its build and output directory
        default: --files sparse --rounds 6 --pool 0 --highs short,infinity --arms none,share-dontneed
      fuse:
        description: patches of docs/research/measurements/dax-budget, each built and measured as an arm through FUSE, by name
        default: share-dontneed
      huge:
        description: build the arm whose window ranges are on huge pages (huge.patch), for --arms huge
        type: boolean
        default: false

permissions:
  contents: read

env:
  TOOLCHAIN: 1.98.1 # keep in sync with rust-toolchain.toml

jobs:
  measure:
    name: measure (${{ matrix.arch }} ${{ matrix.copy }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x86_64, runner: ubuntu-24.04, copy: a }
          - { arch: x86_64, runner: ubuntu-24.04, copy: b }
          - { arch: x86_64, runner: ubuntu-24.04, copy: c }
          - { arch: x86_64, runner: ubuntu-24.04, copy: d }
          - { arch: x86_64, runner: ubuntu-24.04, copy: e }
          - { arch: x86_64, runner: ubuntu-24.04, copy: f }
          - { arch: x86_64, runner: ubuntu-24.04, copy: g }
          - { arch: x86_64, runner: ubuntu-24.04, copy: h }
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Install pinned Rust
        run: scripts/retry 5 30 rustup toolchain install "$TOOLCHAIN" --profile minimal --target ${{ matrix.arch }}-unknown-linux-musl
      - name: zig
        run: scripts/install-zig
      - name: KVM access
        run: sudo chmod 666 /dev/kvm
      - name: User manager
        run: |
          sudo loginctl enable-linger "$USER"
          bus="/run/user/$(id -u)/bus"
          for i in $(seq 300); do [ -S "$bus" ] && break; sleep 0.1; done
          ls -l "$bus"
          echo "XDG_RUNTIME_DIR=/run/user/$(id -u)" >> "$GITHUB_ENV"
      - name: perf
        run: scripts/retry 3 30 sudo apt-get install -y "linux-tools-$(uname -r)" || echo "no perf for $(uname -r)"
      # The tree's shards, the tree's with each window range on huge pages where asked
      # (docs/research/measurements/dax-budget/huge.patch), and the tree's with each patch
      # asked for, each kept apart.
      - name: Build
        env:
          FUSE: ${{ github.event.inputs.fuse || 'share-dontneed' }}
          HUGE: ${{ github.event.inputs.huge == 'true' && 'huge' || '' }}
        run: |
          cargo build --locked -p shards --release
          cp target/release/shards "$RUNNER_TEMP/shards"
          for patch in $HUGE $FUSE; do
            git apply "docs/research/measurements/dax-budget/$patch.patch"
            cargo build --locked -p shards --release
            cp target/release/shards "$RUNNER_TEMP/shards-$patch"
            git checkout -- crates
          done
      - name: Measure
        env:
          ARGS: ${{ github.event.inputs.args || '--files sparse --rounds 6 --pool 0 --highs short,infinity --arms none,share-dontneed' }}
          FUSE: ${{ github.event.inputs.fuse || 'share-dontneed' }}
        run: |
          lscpu | grep -E 'Model name' || true
          free -m
          # Which of Hyper-V's enlightenments this runner's KVM took (svm_onhyperv.c, vmx.c).
          sudo dmesg | grep -i -E 'hyper-v|enlightened|direct tlb flush' | head -20 || true
          # A profile only where asked (--perf in the arguments): it samples the whole host 5
          # to 15 s into each read, which slows the slow reads it profiles.
          # Pushed: the experiment above; asked for: the arguments asked with.
          fuse=""
          for patch in $FUSE; do fuse="$fuse --fuse $patch=$RUNNER_TEMP/shards-$patch"; done
          huge=""
          [ -x "$RUNNER_TEMP/shards-huge" ] && huge="--huge $RUNNER_TEMP/shards-huge"
          python3 -I docs/research/measurements/dax-budget/measure.py "$RUNNER_TEMP/shards" dax-budget \
            $huge $fuse $ARGS
          python3 -I docs/research/measurements/dax-budget/samples.py dax-budget
      - uses: actions/upload-artifact@v7.0.1
        if: always()
        with:
          name: dax-budget-${{ matrix.arch }}-${{ matrix.copy }}
          path: dax-budget

name: net costs

# What a VM's network process costs its host (D31, D14; E1, E2; PM M210): its memory and a
# round trip's beside the connections it holds (benches/net_memory.rs), on the hosts whose
# hypervisor a runner offers, KVM's and WHP's; and on Linux what a run's network costs the
# run (benches/workloads.rs, `network`). Runs when the network process or its benches
# change, or when asked.
on:
  push:
    paths:
      - crates/net/**
      - crates/net-process/**
      - crates/shards/benches/net_memory.rs
      - .github/workflows/net-costs.yml
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  TOOLCHAIN: 1.98.1 # keep in sync with rust-toolchain.toml

jobs:
  measure:
    name: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: linux, runner: ubuntu-24.04 }
          - { os: windows, runner: windows-2025 }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Install pinned Rust
        shell: bash
        run: rustup toolchain install "$TOOLCHAIN" --profile minimal --target x86_64-unknown-linux-musl
      # The guests' C (AWS-LC) is compiled by the pinned zig (crates/shards/build.rs).
      - name: zig
        shell: bash
        run: scripts/install-zig
      # AWS-LC's x64 assembly is built from source on Windows x64 (vendor/README.md), as CI
      # builds it.
      - name: NASM (Windows)
        if: matrix.os == 'windows'
        shell: bash
        run: |
          curl -fsSL --retry 5 --retry-all-errors --retry-delay 10 -o "$RUNNER_TEMP/nasm.zip" https://www.nasm.us/pub/nasm/releasebuilds/3.02/win64/nasm-3.02-win64.zip
          echo "161d0bfaff53c2f9e9f3e69fd0672323ebabafd1268976a5cec11be92a19aee7  $RUNNER_TEMP/nasm.zip" | sha256sum -c
          unzip -q "$RUNNER_TEMP/nasm.zip" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/nasm-3.02" >> "$GITHUB_PATH"
      - name: KVM access (Linux)
        if: matrix.os == 'linux'
        run: sudo chmod 666 /dev/kvm
      - name: Host
        shell: bash
        run: |
          case "$RUNNER_OS" in
            Linux) nproc && free -m && lscpu | grep -E 'Model name|Hypervisor' ;;
            Windows) powershell -NoProfile -Command "(Get-CimInstance Win32_Processor).Name; (Get-CimInstance Win32_ComputerSystem).TotalPhysicalMemory" ;;
          esac
      # Every VM it needs must start: SHARDS_REQUIRE_VMS fails a bench that would skip.
      - name: Memory and round trips beside held connections (E2)
        shell: bash
        env:
          SHARDS_REQUIRE_VMS: "1"
        run: cargo bench --locked -p shards --bench net_memory -- --counts 0,1000,10000 --bytes 0,262144,1048576 --rounds 3 --trips 2000
      - name: What a run's network costs it (E1)
        if: matrix.os == 'linux'
        env:
          SHARDS_REQUIRE_VMS: "1"
        run: cargo bench --locked -p shards --bench workloads -- --runs 100

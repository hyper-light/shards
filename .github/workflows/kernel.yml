name: Kernel

# Builds the shards guest kernel on each architecture's native runner and publishes it as a
# prerelease named after a hash of its inputs. Tests pin a release asset by URL and SHA-256
# (resources/kernel/README.md).
on:
  push:
    branches: [dev, main]
    paths:
      - resources/kernel/**
      - scripts/build-kernel.sh
      - .github/workflows/kernel.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: build (${{ matrix.arch }})
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x86_64, runner: ubuntu-24.04 }
          - { arch: aarch64, runner: ubuntu-24.04-arm }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential bc bison flex libelf-dev libssl-dev
          gcc --version | head -1 | tee out-toolchain.txt
          ld --version | head -1 | tee -a out-toolchain.txt
      - name: Build
        run: scripts/build-kernel.sh ${{ matrix.arch }} out
      - name: Record the toolchain
        run: mv out-toolchain.txt out/toolchain-${{ matrix.arch }}.txt
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: kernel-${{ matrix.arch }}
          path: out/
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/download-artifact@v8.0.1
        with:
          path: out
          merge-multiple: true
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(sed -n 's/^version=//p' scripts/build-kernel.sh)
          inputs=$(cat scripts/build-kernel.sh resources/kernel/*.config | sha256sum | cut -c1-12)
          tag="kernel-$version-$inputs"
          (cd out && sha256sum -- * > SHA256SUMS && cat SHA256SUMS)
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "$tag is already published; its assets stay as they are"
            exit 0
          fi
          gh release create "$tag" out/* --prerelease --target "$GITHUB_SHA" --title "$tag" --notes \
            "Linux $version for shards guests: Firecracker's 6.18 microVM configs with resources/kernel/shards.config, built by scripts/build-kernel.sh at $GITHUB_SHA. Toolchains are in toolchain-*.txt; checksums in SHA256SUMS."

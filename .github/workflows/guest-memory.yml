name: Guest memory

# What a run's guest keeps of its microVM's memory on x86_64 KVM, on the path a run takes,
# for `-m`'s table (crates/shards/src/resources.rs, PM M155, M179): measure-run.py at each
# of the table's sizes at 1, 2 and 4 vCPUs (a runner's 4 CPUs; PM M183), 4 boots of its
# template each and a run a boot (a template's runs keep what its boot left), on three
# runners, as CI's x86_64 jobs run on runners of more than one kind.
on:
  push:
    paths:
      - docs/research/measurements/guest-memory/**
      - .github/workflows/guest-memory.yml
  workflow_dispatch:

permissions:
  contents: read

env:
  TOOLCHAIN: 1.98.0 # keep in sync with rust-toolchain.toml

jobs:
  measure:
    name: measure (${{ matrix.copy }})
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        copy: [a, b, c]
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Install pinned Rust
        run: rustup toolchain install "$TOOLCHAIN" --profile minimal --target x86_64-unknown-linux-musl
      - name: zig
        run: scripts/install-zig
      - name: KVM access
        run: sudo chmod 666 /dev/kvm
      - name: Build
        run: cargo build --locked -p shards --release
      - name: Measure
        run: |
          lscpu | grep -E 'Model name' || true
          nproc
          free -m
          export SHARDS_HOME=$(mktemp -d)
          python3 docs/research/measurements/guest-memory/measure-run.py target/release/shards 1 4 1,2,4

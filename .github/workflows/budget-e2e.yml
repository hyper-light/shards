name: budget E2E

# An E2E test of crates/shards/tests, by default the FUSE budget E2E (tests/daemon.rs
# a_microvm_held_to_a_budget_reads_through_fuse_within_twice_its_time_without_one, D188),
# run on eight ubuntu-24.04 runners at once, each runner's CPU as it lands, as many times in
# a row as asked: whether a test passes run after run across runner CPUs, and whether a
# failure seen once in the whole suite's job comes back, how often and on which CPU, with
# the kernel's word on OOM kills and seccomp refusals where one fails. No failure in n runs
# puts its rate below 3/n at 95%. Runs when the workflow changes, or when asked: a test
# binary, a test's exact name (`all` runs the whole binary, every test beside the rest as
# the suite runs them), and the runs each runner makes.
on:
  push:
    paths:
      - .github/workflows/budget-e2e.yml
  workflow_dispatch:
    inputs:
      test:
        description: its test binary (cargo test --test), bin:PACKAGE:BINARY for a binary's own tests, lib:PACKAGE for a library's own, lib-windows:PACKAGE for a library's own on Windows, or windows:BINARY for a test binary of crates/shards on each Windows runner (windows:bin, the binary's own tests)
        default: daemon
      name:
        description: its exact name; all, the whole binary; on Windows, ignored:NAME runs the ignored test NAME, a measurement
        default: a_microvm_held_to_a_budget_reads_through_fuse_within_twice_its_time_without_one
      times:
        description: runs on each runner, one after another
        default: "1"
      log:
        description: SHARDS_LOG for a Windows E2E run's shards, its VM and network processes too (debug for their every line, on the stderr a test that fails shows); none, warnings alone
        default: ""

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  TOOLCHAIN: 1.98.1 # keep in sync with rust-toolchain.toml

jobs:
  e2e:
    name: budget E2E (${{ matrix.copy }})
    if: ${{ !startsWith(github.event.inputs.test || '', 'lib-windows:') && !startsWith(github.event.inputs.test || '', 'windows:') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        copy: [a, b, c, d, e, f, g, h]
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Install pinned Rust
        run: scripts/retry 5 30 rustup toolchain install "$TOOLCHAIN" --profile minimal --target x86_64-unknown-linux-musl
      - name: zig
        run: scripts/install-zig
      - name: KVM access
        run: sudo chmod 666 /dev/kvm
      - name: User manager
        run: |
          sudo loginctl enable-linger "$USER"
          bus="/run/user/$(id -u)/bus"
          for i in $(seq 300); do [ -S "$bus" ] && break; sleep 0.1; done
          ls -l "$bus"
          echo "XDG_RUNTIME_DIR=/run/user/$(id -u)" >> "$GITHUB_ENV"
      - name: Host
        run: |
          nproc && free -m && lscpu | grep -E 'Model name|Virtualization|Hypervisor'
          uname -r
      - name: E2E
        env:
          SHARDS_REQUIRE_VMS: "1"
          SHARDS_REQUIRE_USER_MANAGER: "1"
          # A push runs the default, as a dispatch with nothing asked does.
          TEST: ${{ github.event.inputs.test || 'daemon' }}
          NAME: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.name || 'a_microvm_held_to_a_budget_reads_through_fuse_within_twice_its_time_without_one' }}
          TIMES: ${{ github.event.inputs.times || '1' }}
        run: |
          if [ "$NAME" != all ]; then args=("$NAME" -- --exact --nocapture); else args=(-- --nocapture); fi
          # bin:PACKAGE:BINARY, a binary's own tests (the VM process's: bin:shards-vm-process:shards-vm);
          # lib:PACKAGE, a library's own (the VMM's: lib:shards-vmm).
          case "$TEST" in
            bin:*) IFS=: read -r _ package binary <<< "$TEST"; target=(-p "$package" --bin "$binary") ;;
            lib:*) target=(-p "${TEST#lib:}" --lib) ;;
            *) target=(-p shards --test "$TEST") ;;
          esac
          failed=0
          for i in $(seq "$TIMES"); do
            echo "== run $i of $TIMES"
            cargo test --locked --profile test-release "${target[@]}" "${args[@]}" \
              || failed=$((failed + 1))
          done
          echo "== $NAME of $TEST failed $failed of $TIMES"
          [ "$failed" -eq 0 ]
      - name: What the kernel logged of seccomp refusals and OOM kills
        if: failure()
        run: |
          sudo dmesg | grep -iE 'seccomp|type=1326|out of memory|oom-kill|killed process' | tail -60 || true
          free -m || true

  # A library's own test on Windows (lib-windows:PACKAGE): the VMM's hold's, whose threads
  # held to their share used past it once in four runs on CI's Windows runner (PM M294).
  windows:
    name: Windows (${{ matrix.copy }})
    if: ${{ startsWith(github.event.inputs.test || '', 'lib-windows:') }}
    runs-on: windows-2025
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        copy: [a, b, c, d, e, f, g, h]
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Install pinned Rust
        shell: bash
        run: |
          scripts/retry 5 30 rustup toolchain install "$TOOLCHAIN" --profile minimal --component clippy --component rustfmt \
            --target x86_64-pc-windows-msvc --target x86_64-unknown-linux-musl --target aarch64-unknown-linux-musl
      - name: Host
        shell: pwsh
        run: |
          [Environment]::ProcessorCount
          (Get-CimInstance Win32_Processor).Name
      - name: Test
        shell: bash
        env:
          TEST: ${{ github.event.inputs.test }}
          NAME: ${{ github.event.inputs.name }}
          TIMES: ${{ github.event.inputs.times }}
        run: |
          package="${TEST#lib-windows:}"
          cargo test --locked --profile test-release -p "$package" --lib --no-run
          failed=0
          for i in $(seq "$TIMES"); do
            cargo test --locked --profile test-release -p "$package" --lib "$NAME" -- --exact \
              || failed=$((failed + 1))
          done
          echo "== $NAME failed $failed of $TIMES"
          [ "$failed" -eq 0 ]

  # A test binary of crates/shards, or the binary's own tests (windows:BINARY, windows:bin),
  # on each Windows runner CI tests on, set up as CI's x86_64 Windows lanes are (ci.yml
  # `native`): a change to the daemon's Windows paths checked before CI runs everything (the
  # platform parity plan's steps 2 and 4). Its name a filter of test names here, `all` every
  # one; each failing test's logs are shown as its directories go (crates/testdir).
  windows-e2e:
    name: Windows E2E (${{ matrix.runner }})
    if: ${{ startsWith(github.event.inputs.test || '', 'windows:') }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        runner: [windows-2022, windows-2025]
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Install pinned Rust
        shell: bash
        run: |
          scripts/retry 5 30 rustup toolchain install "$TOOLCHAIN" --profile minimal --component clippy --component rustfmt \
            --target x86_64-pc-windows-msvc --target x86_64-unknown-linux-musl --target aarch64-unknown-linux-musl
      - name: zig
        shell: bash
        run: scripts/install-zig
      - name: NASM
        shell: bash
        run: |
          curl -fsSL --retry 5 --retry-all-errors --retry-delay 10 -o "$RUNNER_TEMP/nasm.zip" https://www.nasm.us/pub/nasm/releasebuilds/3.02/win64/nasm-3.02-win64.zip
          echo "161d0bfaff53c2f9e9f3e69fd0672323ebabafd1268976a5cec11be92a19aee7  $RUNNER_TEMP/nasm.zip" | sha256sum -c
          unzip -q "$RUNNER_TEMP/nasm.zip" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/nasm-3.02" >> "$GITHUB_PATH"
      - name: Host
        shell: pwsh
        run: |
          [Environment]::ProcessorCount
          (Get-CimInstance Win32_Processor).Name
          [System.Environment]::OSVersion.VersionString
          # What the tests have room for: each disk's free space, the memory, the page file.
          Get-PSDrive -PSProvider FileSystem | Format-Table Name, Root, @{n='FreeGB';e={[math]::Round($_.Free/1GB,1)}}, @{n='UsedGB';e={[math]::Round($_.Used/1GB,1)}}
          $os = Get-CimInstance Win32_OperatingSystem
          "memory: {0:N1} GB, {1:N1} GB free" -f ($os.TotalVisibleMemorySize/1MB), ($os.FreePhysicalMemory/1MB)
          Get-CimInstance Win32_PageFileUsage | Format-Table Name, AllocatedBaseSize, CurrentUsage, PeakUsage
          "TEMP: $env:TEMP"
          # Microsoft's console debugger, which a hung client's stacks are taken with (tests/common `stuck`).
          "cdb: " + (Test-Path "${env:ProgramFiles(x86)}\Windows Kits\10\Debuggers\x64\cdb.exe")
      - name: Test
        timeout-minutes: 120
        shell: bash
        env:
          SHARDS_REQUIRE_VMS: "1"
          SHARDS_LOG: ${{ github.event.inputs.log }}
          # A failing test's logs whole where its programs log at debug (crates/testdir).
          SHARDS_TEST_LOG_SHOWN: ${{ github.event.inputs.log == 'debug' && '16777216' || '' }}
          TEST: ${{ github.event.inputs.test }}
          NAME: ${{ github.event.inputs.name }}
          TIMES: ${{ github.event.inputs.times }}
        run: |
          binary="${TEST#windows:}"
          if [ "$binary" = bin ]; then target=(--bin shards); else target=(--test "$binary"); fi
          case "$NAME" in
            all) args=(-- --nocapture) ;;
            ignored:*) args=("${NAME#ignored:}" -- --ignored --exact --nocapture) ;;
            *) args=("$NAME" -- --nocapture) ;;
          esac
          # The temp disk's free space, the free memory and the page file's use as the tests
          # run, every 5 s: whether they meet the runner's room.
          pwsh -NoProfile -Command 'while ($true) { $os = Get-CimInstance Win32_OperatingSystem; $p = (Get-CimInstance Win32_PageFileUsage | Measure-Object CurrentUsage -Sum).Sum; "{0:HH:mm:ss} {1} free {2:N1} GB, memory free {3:N1} GB, page file {4} MB" -f (Get-Date).ToUniversalTime(), $env:TEMP.Substring(0,2), ((Get-PSDrive $env:TEMP.Substring(0,1)).Free/1GB), ($os.FreePhysicalMemory/1MB), $p; Start-Sleep 5 }' > "$RUNNER_TEMP/host.log" 2>&1 &
          sampler=$!
          failed=0
          for i in $(seq "$TIMES"); do
            echo "== run $i of $TIMES"
            cargo test --locked --profile test-release --target x86_64-pc-windows-msvc -p shards "${target[@]}" "${args[@]}" \
              || failed=$((failed + 1))
          done
          kill "$sampler" 2>/dev/null
          echo "== the host as the tests ran"
          cat "$RUNNER_TEMP/host.log"
          echo "== $NAME of $TEST failed $failed of $TIMES"
          [ "$failed" -eq 0 ]

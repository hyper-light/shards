name: CI

on:
  push:
    # Every change but a measurement's own scripts, patches, notes and data, and the
    # workflows that run them alone, which no build or test reads: those run their own
    # jobs. A measurement's Rust (tests/fleet.rs and commit.rs take theirs by #[path]) is
    # built here.
    paths:
      - "**"
      - "!docs/research/measurements/**/*.py"
      - "!docs/research/measurements/**/*.sh"
      - "!docs/research/measurements/**/*.patch"
      - "!docs/research/measurements/**/*.md"
      - "!docs/research/measurements/**/*.json"
      - "!docs/research/measurements/**/*.c"
      - "!docs/research/measurements/**/Dockerfile"
      - "!docs/research/measurements/**/*.txt"
      - "!docs/research/measurements/**/*.ps1"
      - "!.github/workflows/builder-cold.yml"
      - "!.github/workflows/builder-pressure.yml"
      - "!.github/workflows/dax-budget.yml"
      - "!.github/workflows/dax-huge.yml"
      - "!.github/workflows/dax-boot-memory.yml"
      - "!.github/workflows/envelope.yml"
      - "!.github/workflows/budget-e2e.yml"
      - "!.github/workflows/restore-faults.yml"
      - "!.github/workflows/windows-pipe.yml"
      - "!.github/workflows/windows-watch.yml"
      - "!.github/workflows/whp-restore.yml"
      - "!.github/workflows/windows-binaries.yml"
      - "!.github/workflows/windows-wake.yml"
      - "!.github/workflows/windows-lower.yml"
      - "!.github/workflows/whp-passthrough.yml"
      - "!.github/workflows/migrate-e2e.yml"
      - "!.github/workflows/softvirt-traps.yml"
      - "!.github/workflows/d261-intel.yml"
      - "!.github/workflows/whp-maxvcpu.yml"
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  TOOLCHAIN: 1.98.1 # keep in sync with rust-toolchain.toml
  # Static musl builds run in this Alpine image on their native architecture. The digest pins
  # the multi-arch index, so each runner pulls its own architecture.
  MUSL_IMAGE: rust:1.98.1-alpine@sha256:7cc1c22d77d9432f7fe012a70e6d3e555af54c2a6832700ed7d553f1769ae89f

# Runs give way to newer ones (PM M539): a push's run on a branch or a pull request is cancelled
# by the next push's, and on main the run under way finishes while only the newest push's waits,
# replacing any that waited before it. A run dispatched by hand has a group of its own, so a
# measurement asked for is never cancelled or replaced.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'workflow_dispatch' && github.run_id || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' && github.ref != 'refs/heads/main' }}

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - run: python3 scripts/check-development-policy
      # Only the pinned zig compiles shards' C (scripts/zig-pin), checked with stand-ins.
      - run: scripts/zig-pin-check
      - run: scripts/retry 5 30 rustup toolchain install "$TOOLCHAIN" --profile minimal --component rustfmt
      - run: cargo fmt --all --check

  # The vendored crates are what crates.io publishes, file for file (vendor/README.md).
  vendor:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - run: scripts/vendor-crate --check

  # The dependency graph against RustSec's advisories, and the exceptions' expiry
  # (deny.toml). Apart from `vendor`: a vulnerability is not a provenance question.
  advisories:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - run: scripts/retry 5 30 rustup toolchain install "$TOOLCHAIN" --profile minimal
      - name: cargo-deny 0.20.2, the published build, pinned
        run: |
          curl -fsSL --retry 5 --retry-all-errors --retry-delay 10 -o "$RUNNER_TEMP/deny.tgz" https://github.com/EmbarkStudios/cargo-deny/releases/download/0.20.2/cargo-deny-0.20.2-x86_64-unknown-linux-musl.tar.gz
          echo "9f12ed4c49936e09b48bf862b595cde2fe64fcbd9d74dfacac6131ca824c8d5f  $RUNNER_TEMP/deny.tgz" | sha256sum -c
          tar xzf "$RUNNER_TEMP/deny.tgz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/cargo-deny-0.20.2-x86_64-unknown-linux-musl" >> "$GITHUB_PATH"
      - run: scripts/advisory-exceptions
      - run: cargo deny --locked check advisories

  # The parsers of what registries, images, guests and users send, fuzzed for a bounded
  # time each (fuzz/Cargo.toml). A crash fails the job and prints its input.
  fuzz:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7.0.1
      - run: scripts/retry 5 30 rustup toolchain install nightly-2026-09-05 --profile minimal
      # Built with the pinned stable toolchain: on nightly its locked rustix takes
      # compiler-internal attributes this nightly no longer has.
      - run: scripts/retry 5 30 rustup toolchain install "$TOOLCHAIN" --profile minimal
      - run: cargo +"$TOOLCHAIN" install --locked cargo-fuzz --version 0.13.1
      - run: cargo +nightly-2026-09-05 fuzz build
      - name: Fuzz, 60 s a target
        run: |
          for target in $(cargo +nightly-2026-09-05 fuzz list); do
            if ! cargo +nightly-2026-09-05 fuzz run "$target" -- -max_total_time=60 -rss_limit_mb=2048 -max_len=65536; then
              for crash in fuzz/artifacts/"$target"/*; do echo "$crash:"; xxd "$crash" | head -64; done
              exit 1
            fi
          done

  # Host threads reach guest memory one at a time (docs/design/architecture.md D29):
  # ThreadSanitizer and Miri check the tests where they share it. Both need nightly.
  memory-model:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7.0.1
      - run: scripts/retry 5 30 rustup toolchain install nightly-2026-09-05 --profile minimal --component rust-src,miri
      - run: docs/research/measurements/access-guard/check.sh nightly-2026-09-05

  # The platform matrix (docs/design/architecture.md D13) on native runners. Every target is
  # linted; the ones a runner can execute are tested. VM tests print SKIP where the host has
  # no backend yet or no hardware virtualization. x86_64 Windows is tested on Windows Server
  # 2022 as well as 2025, each with its hypervisor platform (WHP partitions run on both: PM's
  # windows-2022 and windows-2025 entries), as a daemon's users run both. arm64 Windows is
  # built and tested on windows-11-arm, whose image has no hypervisor platform (PM M172), so
  # its VM tests say SKIP.
  #
  # Each job's Tests step has a limit of its own (`tests_minutes`, PM M619), from the Tests
  # steps of CI's runs on main that ran to their end, neither cut nor cancelled, in the job's
  # shape (`scripts/ci/tests-budget 43990298221 44205094460`: every run since M613's): its
  # slowest plus its spread, the slowest less the quickest, as the next run may differ from the
  # slowest by as much as those did from one another; a job with one takes the widest spread
  # any job showed, as a share of its slowest, 0.541 (arm64 musl's). Those runs raise macOS to
  # 59 (n 9, 34.75 to 46.82 minutes), x86_64 Linux to 68 (n 1, 43.62), windows-2025 to 156 (n
  # 1, 100.82) and windows-2022 to 136 (n 2, 101.12 to 118.13). Where they derive less, a
  # job's limit stays (arm64 Linux 56, from 32: n 9, 23.55 to 27.70; arm64 Windows 35, from
  # 13: n 5, 10.80 to 11.75): none ran the tests the jobs run now (ROOT's ruling, 2026-11-18),
  # and a limit falls only on 19 runs of the current set (`--current-from` its first): the next
  # of exchangeable runs passes the slowest of n with chance 1/(n+1), 5% at 19 (PM M619).
  #
  # The tests' builds and the jobs' other steps keep M420's rule, a third above their slowest
  # (M245, M420, M613). arm64 Windows' build of the tests outgrew its tests' step, 20.3 to 21.1
  # minutes on 2026-11-12 and 30.8 by 2026-11-17 (M613), so it builds them in a step of its
  # own, as the musl job does (M560): 42 minutes, a third above that 30.8. x86_64 Linux's build
  # of its tests outgrew the tests' step too on Azure's AMD EPYC 7763 runners, 25.4 minutes in
  # CI 44138098584 (at 8247e14), where EC2's Intel Xeon 6975P-C took 19.2 in 44076016255, so it
  # builds them in a step of its own as well: 34 minutes, a third above 25.4. Each job has its
  # steps' limits and a third above its other steps' slowest: macOS' 14.1 (19, arm64 Linux's
  # too), windows-2025's 17.1 (23), windows-2022's 16.3 (22), arm64 Windows' 18.3 (25), and
  # x86_64 Linux's 19.1 (26): 8.0 before its tests, and its stack guards' release build, cut
  # 11.1 minutes in by run 44138098584's job limit (unmeasured past it).
  native:
    name: ${{ matrix.name || matrix.target }}
    timeout-minutes: ${{ matrix.job_minutes }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: aarch64-apple-darwin, runner: macos-15, test: true, tests_minutes: 59, job_minutes: 78 }
          - { target: x86_64-unknown-linux-gnu, runner: ubuntu-24.04, test: true, build_minutes: 34, tests_minutes: 68, job_minutes: 128 }
          - { target: aarch64-unknown-linux-gnu, runner: ubuntu-24.04-arm, test: true, tests_minutes: 56, job_minutes: 75 }
          - { target: x86_64-pc-windows-msvc, runner: windows-2025, test: true, tests_minutes: 156, job_minutes: 179 }
          - { target: x86_64-pc-windows-msvc, runner: windows-2022, test: true, tests_minutes: 136, job_minutes: 158, name: x86_64-pc-windows-msvc (windows-2022) }
          - { target: aarch64-pc-windows-msvc, runner: windows-11-arm, test: true, build_minutes: 42, tests_minutes: 35, job_minutes: 102 }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Install pinned Rust
        shell: bash
        # Guest binaries build for every architecture's musl target. Every component
        # rust-toolchain.toml names, here: a cargo proxy that installs one as a later step
        # starts failed once on a file already there ('bin/cargo-fmt').
        run: |
          scripts/retry 5 30 rustup toolchain install "$TOOLCHAIN" --profile minimal --component clippy --component rustfmt \
            --target ${{ matrix.target }} --target x86_64-unknown-linux-musl --target aarch64-unknown-linux-musl
      # shards-init's C (AWS-LC, for the in-VM server's TLS) is compiled by zig on every host
      # (crates/shards/build.rs): 0.16.0, pinned by digest.
      - name: zig
        shell: bash
        run: scripts/install-zig
      # AWS-LC's x64 assembly is built from source, never from the objects aws-lc-sys ships
      # (vendor/README.md), so Windows x64 needs NASM: the official 3.02 build, pinned.
      - name: NASM (Windows x64)
        if: matrix.target == 'x86_64-pc-windows-msvc'
        shell: bash
        run: |
          # Retried: Windows' TLS checks revocation online, and its server is sometimes
          # unreachable (CRYPT_E_REVOCATION_OFFLINE); the digest below checks the file.
          curl -fsSL --retry 5 --retry-all-errors --retry-delay 10 -o "$RUNNER_TEMP/nasm.zip" https://www.nasm.us/pub/nasm/releasebuilds/3.02/win64/nasm-3.02-win64.zip
          echo "161d0bfaff53c2f9e9f3e69fd0672323ebabafd1268976a5cec11be92a19aee7  $RUNNER_TEMP/nasm.zip" | sha256sum -c
          unzip -q "$RUNNER_TEMP/nasm.zip" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/nasm-3.02" >> "$GITHUB_PATH"
      - name: Host virtualization (what this runner offers each backend)
        shell: bash
        run: |
          case "$RUNNER_OS" in
            # Its CPU and KVM's parameters, a failed VM entry's VMCS kept (scripts/ci/kvm-host).
            # And what VFIO may pass through: IOMMU groups, the VFIO and mediated-device
            # (mdev) modules and the kernel's config of them, for a test device.
            Linux)
              ls -l /dev/kvm 2>&1 || true
              scripts/ci/kvm-host
              ls /sys/kernel/iommu_groups 2>&1 | head -5 || true
              ls /sys/class/mdev_bus 2>&1 || true
              for m in vfio vfio_pci vfio_iommu_type1 mdev mtty mbochs mdpy; do modinfo -F filename "$m" 2>&1 || true; done
              grep -E "CONFIG_(VFIO|VFIO_PCI|VFIO_MDEV|SAMPLE_VFIO_MDEV_MTTY|IOMMUFD|VFIO_NOIOMMU)=" "/boot/config-$(uname -r)" 2>&1 || true
              ;;
            macOS) sysctl kern.hv_support || true ;;
            Windows) powershell -NoProfile -Command \
              "(Get-CimInstance Win32_Processor).Name; (Get-CimInstance Win32_ComputerSystem).HypervisorPresent; (Get-WindowsOptionalFeature -Online -FeatureName HypervisorPlatform).State" || true ;;
          esac
      # The runner's image, its OS and version, which what this job keeps from run to run is
      # keyed by: the GPU's renderer built on it, and the tests' judge's records.
      - name: The runner's image
        id: image
        shell: bash
        run: echo "image=$ImageOS-$ImageVersion" >> "$GITHUB_OUTPUT"
      # The GPU's renderer (D144, D201, D202), from pinned sources: `shards` then carries
      # shards-vm-gpu, on macOS, on Linux with glibc (musl's in Alpine, below) and on x86_64 Windows. Built once for
      # each version of its script and patch and of the runner's image, and kept: its
      # sources' hosts answering 502 and 504 for eight minutes (run 39191414199) left a run
      # with none, and none of its macOS tests ran.
      - name: The GPU's renderer, as built before
        if: matrix.target == 'aarch64-apple-darwin' || endsWith(matrix.target, '-linux-gnu') || matrix.target == 'x86_64-pc-windows-msvc'
        id: gpu-kept
        uses: actions/cache@v6.1.0
        with:
          path: ${{ runner.temp }}/gpu-libs
          key: gpu-libs-${{ steps.image.outputs.image }}-${{ hashFiles('scripts/gpu-libs', 'resources/gpu/**') }}
      - name: The GPU's renderer
        if: matrix.target == 'aarch64-apple-darwin' || endsWith(matrix.target, '-linux-gnu') || matrix.target == 'x86_64-pc-windows-msvc'
        shell: bash
        run: |
          if [ "${{ steps.gpu-kept.outputs.cache-hit }}" != true ]; then
            scripts/gpu-libs "$RUNNER_TEMP/gpu-libs"
          fi
          echo "SHARDS_GPU_LIBS=$RUNNER_TEMP/gpu-libs" >> "$GITHUB_ENV"
      - name: Lints (production code never panics; clippy.toml exempts tests)
        shell: bash
        run: cargo clippy --locked --workspace --all-targets --target ${{ matrix.target }} -- -D warnings
      - name: Lints of the GPU's renderer
        if: matrix.target == 'aarch64-apple-darwin' || endsWith(matrix.target, '-linux-gnu') || matrix.target == 'x86_64-pc-windows-msvc'
        shell: bash
        run: cargo clippy --locked -p shards-vmm --features gpu --all-targets --target ${{ matrix.target }} -- -D warnings
      # The runner's /dev/kvm is root:kvm 0660 and the runner user is not in `kvm`.
      # As a rule of udev's, not a chmod: a later step's apt install restarts systemd-udevd
      # (needrestart), which put /dev/kvm back to 0660 root:kvm before the tests ran (run
      # 43575280954: every VM test refused "cannot open /dev/kvm: permission denied").
      - name: KVM access (Linux)
        if: runner.os == 'Linux'
        run: |
          if [ -e /dev/kvm ]; then
            echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
            sudo udevadm control --reload-rules
            sudo udevadm trigger --name-match=kvm
            sudo chmod 666 /dev/kvm
          fi
      # The runner user's systemd manager, as a login has one (D183): `--cgroup-parent`'s
      # test makes microVMs under its slices, on its bus.
      - name: User manager (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo loginctl enable-linger "$USER"
          bus="/run/user/$(id -u)/bus"
          for i in $(seq 300); do [ -S "$bus" ] && break; sleep 0.1; done
          ls -l "$bus"
          echo "XDG_RUNTIME_DIR=/run/user/$(id -u)" >> "$GITHUB_ENV"
      # What a hung test's processes are doing, kept as it hangs (scripts/ci/hang-watch.sh):
      # gdb for their backtraces, where the runner boots microVMs. Its package index read
      # afresh first: an image's own names versions its mirrors may no longer serve (run
      # 43513425954's ubuntu-24 20261028.624 asked for libc6-dbg 2.39-0ubuntu8.9, 404 on
      # every mirror, five times).
      - name: Hang watcher's gdb (Linux x86_64)
        if: matrix.test && matrix.target == 'x86_64-unknown-linux-gnu'
        run: scripts/retry 5 30 sh -c 'sudo apt-get update && sudo apt-get install -y gdb'
      # What the tests' judge learned from CI's runs on this image, architecture and target
      # (D261): its records alone, the newest kept restored here, and kept again under this
      # run's own key once the tests end (`The judge's records, kept`), as a key once kept is
      # never written again.
      - name: The judge's records
        if: matrix.test
        uses: actions/cache/restore@v6.1.0
        with:
          path: target/judge-records-kept
          key: judge-records-${{ steps.image.outputs.image }}-${{ runner.arch }}-${{ matrix.target }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: judge-records-${{ steps.image.outputs.image }}-${{ runner.arch }}-${{ matrix.target }}-
      # Put in place for the tests, which write it as they run; the cache's copy kept apart
      # (`The judge's records, staged`).
      - name: The judge's records, in place
        if: matrix.test
        shell: bash
        run: mkdir -p target/judge-records && if [ -d target/judge-records-kept ]; then cp -a target/judge-records-kept/. target/judge-records/; fi
      # Where the job's build of the tests has a limit of its own (`build_minutes`, above), they
      # are built here; the tests' step then builds nothing, as no variable it sets reaches a
      # build script.
      - name: Build the tests
        if: matrix.test && matrix.build_minutes
        timeout-minutes: ${{ matrix.build_minutes }}
        shell: bash
        run: cargo test --locked --workspace --profile test-release --no-run --target ${{ matrix.target }}
      # Where the runner offers its backend's hypervisor, every VM test must run: one that
      # cannot fails rather than skips (tests/common, SHARDS_REQUIRE_VMS). Every test binary
      # runs, whatever fails before it: a failing one hides none after it.
      - name: Tests
        if: matrix.test
        timeout-minutes: ${{ matrix.tests_minutes }}
        shell: bash
        run: |
          case "${{ matrix.target }}" in
            # KVM on Linux's, WHP on Windows' (D140); and on Linux, the user's systemd
            # manager (D183).
            x86_64-unknown-linux-gnu) export SHARDS_REQUIRE_VMS=1 SHARDS_REQUIRE_USER_MANAGER=1 ;;
            # And shards-api's judge says what each look that found a VM process idle saw
            # of its threads (SHARDS_JUDGE_TRACE), so a stall cut on WHP leaves its evidence.
            x86_64-pc-windows-msvc) export SHARDS_REQUIRE_VMS=1 SHARDS_JUDGE_TRACE=1 ;;
          esac
          # The tests that must reach Docker Hub itself run here, as before they were gated;
          # where a LAN's machines share an address and its pulls, they skip unless asked
          # (tests/common, cannot_reach_docker_hub).
          export SHARDS_TESTS_DOCKER_HUB=1
          if [ "${{ matrix.target }}" = x86_64-unknown-linux-gnu ]; then
            scripts/ci/hang-watch.sh "$RUNNER_TEMP/hangs" &
            watcher=$!
          fi
          status=0
          cargo test --locked --workspace --profile test-release --no-fail-fast --target ${{ matrix.target }} || status=$?
          if [ -n "${watcher:-}" ]; then kill "$watcher" 2>/dev/null || true; fi
          exit "$status"
      # Kept wherever the tests ended, passed, failed or out of time, but not in a cancelled
      # run (D261, ROOT's ruling of 2026-11-17): a record holds only waits that were answered,
      # evidence whatever became of their job. Kept only by a passing job, the x86_64 musl
      # job, which failed run after run, began cold every time (CI 43968984258).
      # The records as their tests left them, copied whole and renamed into place, for the cache
      # to read a tree no process writes: read in place, a cut test step's processes still wrote
      # them as tar read ("target/judge-records/linux-x86_64-4: file changed as we read it"),
      # nothing was kept, and every next run began cold (CI 44164945050, x86_64 gnu). A record a
      # process replaces as it is copied is said and left out; the rest are kept.
      - name: The judge's records, staged
        if: ${{ !cancelled() && matrix.test }}
        shell: bash
        run: |
          rm -rf target/judge-records-kept.new && mkdir -p target/judge-records
          cp -a target/judge-records target/judge-records-kept.new || echo "records replaced as they were copied are left out"
          rm -rf target/judge-records-kept && mv target/judge-records-kept.new target/judge-records-kept
      - name: The judge's records, kept
        if: ${{ !cancelled() && matrix.test }}
        uses: actions/cache/save@v6.1.0
        with:
          path: target/judge-records-kept
          key: judge-records-${{ steps.image.outputs.image }}-${{ runner.arch }}-${{ matrix.target }}-${{ github.run_id }}-${{ github.run_attempt }}
      - name: What hung tests' processes were doing
        if: ${{ !cancelled() && matrix.test && matrix.target == 'x86_64-unknown-linux-gnu' }}
        shell: bash
        run: |
          for f in $(find "$RUNNER_TEMP/hangs" -type f 2>/dev/null | sort); do
            echo "::group::$f"
            cat "$f"
            echo "::endgroup::"
          done
      - name: Tests of the GPU's renderer
        if: matrix.target == 'aarch64-apple-darwin' || endsWith(matrix.target, '-linux-gnu') || matrix.target == 'x86_64-pc-windows-msvc'
        timeout-minutes: 15
        shell: bash
        run: |
          cargo test --locked -p shards-vmm --features gpu --profile test-release --target ${{ matrix.target }} gpu::
      # The stack guards are release's (crates/rego: stack::LEAF, RULE_STEP, and the policy
      # thread's STACK): measured on release, whose fat LTO puts more in each frame than
      # test-release does, so the tests that hold every target to them run on release too
      # (M159).
      - name: Stack guards, on release
        if: ${{ !cancelled() && matrix.test }}
        timeout-minutes: 15
        shell: bash
        run: cargo test --locked --release -p shards-rego --test builtins --test deep --test depth --target ${{ matrix.target }}
      # A process the seccomp filter ended with its SIGSYS blocked says nothing; the kernel
      # logs the syscall it refused (the filter's SECCOMP_FILTER_FLAG_LOG). Nor does one the
      # host's OOM killer ended: the kernel logs which it chose, and the memory it had. Nor
      # does a VM whose entry failed: KVM logs the VMCS it was refused (scripts/ci/kvm-host).
      - name: What the kernel logged of seccomp refusals, OOM kills and failed VM entries
        if: failure() && runner.os == 'Linux'
        run: |
          sudo dmesg | grep -iE 'seccomp|type=1326|out of memory|oom-kill|killed process' | tail -60 || true
          sudo dmesg | grep -E 'kvm' || true
          free -m || true

  # shards against Firecracker on one KVM host: the same kernel, initrd and command line,
  # interleaved (crates/shards/benches/firecracker.rs). Hosted arm64 runners have no /dev/kvm.
  # Its limit, as M560 makes a job's: its steps' own limits, Arrival's 5 and Guest memory's 1,
  # and a third above the slowest its other steps took together in GitHub's records, 1421 s
  # (CI 44189693085, the six snapshot pairs in), with the 408 s at most its comparison now
  # waits to read restores' and fleets' memory (396 restores and 12 fleets, each a working
  # set's window, RECORD_FOR's 1 s, D36): 2439 s, so 41 (D209 Part 11 amended). A job cut at
  # its limit kept no log and ran no step after it, 12 times of 12.
  firecracker:
    name: firecracker comparison (x86_64)
    runs-on: ubuntu-24.04
    timeout-minutes: 47
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Install pinned Rust
        run: scripts/retry 5 30 rustup toolchain install "$TOOLCHAIN" --profile minimal --target x86_64-unknown-linux-musl
      - name: zig
        run: scripts/install-zig
      - name: KVM access
        run: sudo chmod 666 /dev/kvm
      # Its CPU and KVM's parameters, a failed VM entry's VMCS kept (scripts/ci/kvm-host).
      - name: Host
        run: |
          nproc && free -m
          scripts/ci/kvm-host
          grep -H . /sys/kernel/mm/transparent_hugepage/{enabled,defrag,hpage_pmd_size}
      - name: The runner's image
        id: image
        run: echo "image=$ImageOS-$ImageVersion" >> "$GITHUB_OUTPUT"
      # What the benches' judge learned from this job's runs on this image (D261, D209 Part
      # 11), restored and kept as the tests' records are, under a key of this job's own: the
      # newest kept restored here, and kept again under this run's key once the benches end.
      - name: The judge's records
        uses: actions/cache/restore@v6.1.0
        with:
          path: target/judge-records-kept
          key: judge-records-${{ steps.image.outputs.image }}-${{ runner.arch }}-firecracker-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: judge-records-${{ steps.image.outputs.image }}-${{ runner.arch }}-firecracker-
      # Put in place for the benches, the cache's copy kept apart, as the tests' are.
      - name: The judge's records, in place
        shell: bash
        run: mkdir -p target/judge-records && if [ -d target/judge-records-kept ]; then cp -a target/judge-records-kept/. target/judge-records/; fi
      # Every sample, in the order taken, for the envelope and the artifact below.
      - name: Compare
        env:
          SHARDS_BENCH_SAMPLES: ${{ github.workspace }}/target/bench-samples
        run: cargo bench --locked -p shards --bench firecracker -- --runs 30
      # shards no worse than Firecracker on any axis, pair by pair (scripts/bench-envelope,
      # docs/benchmarks-envelope.toml).
      - name: Envelope
        run: scripts/bench-envelope target/bench-samples
      # Guest memory advised for huge pages or not, under the runner's THP (PM M157, M225):
      # what the advice buys a boot, and what it costs a boot's tail where THP gives huge
      # pages to all memory and compacts at a fault only for memory advised.
      - name: THP advice
        if: always()
        env:
          SHARDS_BENCH_SAMPLES: ${{ github.workspace }}/target/bench-samples
        run: cargo bench --locked -p shards --bench firecracker -- --thp-ab all,unadvised --runs 30
      # shards' own restores and pooled runs on this KVM host (docs/benchmarks.md).
      - name: Restore
        if: always()
        env:
          SHARDS_BENCH_SAMPLES: ${{ github.workspace }}/target/bench-samples
        run: cargo bench --locked -p shards --bench restore -- --runs 30
      - name: Image
        if: always()
        env:
          SHARDS_BENCH_SAMPLES: ${{ github.workspace }}/target/bench-samples
        run: cargo bench --locked -p shards --bench image -- --runs 100 --templates 5
      # The samples so far, kept before Arrival whatever comes of the steps after it: CI
      # 44164945050's job ran out of its limit after Arrival, and kept neither its log nor its
      # samples (D209 Part 11 amended). The last step keeps every bench's under the same name.
      - name: Raw samples, before Arrival
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: bench-samples-${{ github.sha }}
          path: target/bench-samples/
          if-no-files-found: warn
          overwrite: true
      # Requests arriving at rising rates, open loop, past what the host serves
      # (benches/arrival.rs): latency from when each was due, failures, and throughput. Its
      # limit is a third above the slowest of its 33 passes in GitHub's records, 185 s, so
      # 247 s, in whole minutes (D209 Part 11): a step cut at its own limit ends as a step, its
      # log and the steps after it kept, where each of the eleven runs cut at the job's 30
      # minutes in this step kept neither.
      - name: Arrival
        if: always()
        timeout-minutes: 5
        env:
          SHARDS_BENCH_SAMPLES: ${{ github.workspace }}/target/bench-samples
        run: cargo bench --locked -p shards --bench arrival -- --rates 2,5,10,20,40 --secs 10
      # A bench cut at its limit leaves its home, and its daemon and microVMs running: the
      # daemon is a session of its own (daemon.rs `detach`), which no step's end reaches. Each
      # left is stopped and its log said, so that no step after runs beside them: Guest memory,
      # 22 to 35 s in 33 passes, had run 293 s at the job's limit beside CI 44164945050's. A
      # bench some of whose requests failed keeps its home too, its daemon's log saying why.
      - name: Arrival's daemon, stopped
        if: always()
        run: |
          status=0
          for home in "$PWD"/target/bench/arrival-*; do
            [ -d "$home" ] || continue
            SHARDS_HOME="$home" target/release/shards daemon stop || status=$?
            echo "::group::$home/daemon.log"
            cat "$home/daemon.log"
            echo "::endgroup::"
          done
          exit "$status"
      # Kept wherever the benches ended, passed, failed or out of time, but not in a cancelled
      # run, as the tests' records are (D261).
      # Copied whole and renamed into place first, as the tests' are.
      - name: The judge's records, staged
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          rm -rf target/judge-records-kept.new && mkdir -p target/judge-records
          cp -a target/judge-records target/judge-records-kept.new || echo "records replaced as they were copied are left out"
          rm -rf target/judge-records-kept && mv target/judge-records-kept.new target/judge-records-kept
      - name: The judge's records, kept
        if: ${{ !cancelled() }}
        uses: actions/cache/save@v6.1.0
        with:
          path: target/judge-records-kept
          key: judge-records-${{ steps.image.outputs.image }}-${{ runner.arch }}-firecracker-${{ github.run_id }}-${{ github.run_attempt }}
      # What the guest kernel keeps of a microVM's memory by its size, on x86_64 (PM M117,
      # measured on arm64): shards sizes a microVM so that -m fits beside it. Its limit is a
      # third above the slowest of its 33 passes in GitHub's records, 35 s, so 47 s, in whole
      # minutes (D209 Part 11 amended).
      - name: Guest memory (M117)
        if: always()
        timeout-minutes: 1
        run: SHARDS_HOME=$(mktemp -d) docs/research/measurements/guest-memory/measure-direct.sh target/release/shards
      # Every bench's samples, in place of those kept before Arrival.
      - name: Raw samples
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: bench-samples-${{ github.sha }}
          path: target/bench-samples/
          if-no-files-found: warn
          overwrite: true
      # What the kernel logged of OOM kills and failed VM entries, its whole log of them, in
      # every run: on an Intel Xeon 6975P-C, two Arrival steps that passed failed 108 and 362 of
      # their 386 requests at 40 a second, and no log said why (D209 Part 11 amended).
      - name: What the kernel logged of seccomp refusals, OOM kills and failed VM entries
        if: always()
        run: |
          sudo dmesg | grep -iE 'seccomp|type=1326|out of memory|oom-kill|killed process' || true
          sudo dmesg | grep -E 'kvm' || true
          free -m || true

  # Each musl target in two jobs at once: the tests; and the lints, the release build whose
  # executable must be static, and the tests measured on release. One after the other
  # they took 43 of the step's 45 minutes on x86_64 (M156). With the lints and the release
  # tests beside the tests instead, the x86_64 tests took 30 to 45 minutes, slower runners
  # 1.7 times as long as the fastest, and one ran out of time (M187). Two weeks on, slow
  # runners' jobs took 37 to 45 minutes and one ran out of the step's 45, so the step has
  # 60 and the job 70: a third above the slowest (M235). The test job then outgrew its 60,
  # its build in Alpine taking up to 46 minutes, so it builds the tests and runs them in
  # steps of their own, each a third above its slowest, and its job those two and a third
  # above its other steps' slowest (M560); the release job's slowest, 43.8, keeps its 60.
  # Running the tests has a limit of its own for each target, derived as the native jobs'
  # Tests steps' are (`tests_minutes`, PM M619): x86_64's raised to 64 (n 8, 24.33 to 44.08
  # minutes), arm64's kept at 58 (from 30: n 12, 8.87 to 19.32, of an older test set). Each
  # test job has those, its build's 62, and a third above its other steps' slowest, 5.8 (8).
  musl:
    name: ${{ matrix.target }}${{ matrix.part == 'release' && ' release' || '' }}
    timeout-minutes: ${{ matrix.job_minutes }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: x86_64-unknown-linux-musl, runner: ubuntu-24.04, part: test, build_minutes: 62, tests_minutes: 64, job_minutes: 134 }
          - { target: aarch64-unknown-linux-musl, runner: ubuntu-24.04-arm, part: test, build_minutes: 62, tests_minutes: 58, job_minutes: 128 }
          - { target: x86_64-unknown-linux-musl, runner: ubuntu-24.04, part: release, build_minutes: 60, job_minutes: 70 }
          - { target: aarch64-unknown-linux-musl, runner: ubuntu-24.04-arm, part: release, build_minutes: 60, job_minutes: 70 }
    runs-on: ${{ matrix.runner }}
    env:
      TARGET: ${{ matrix.target }}
      MUSL_CI: ${{ matrix.part }}
    steps:
      - uses: actions/checkout@v7.0.1
      # Its CPU and KVM's parameters, a failed VM entry's VMCS kept (scripts/ci/kvm-host).
      - name: Host virtualization (what this runner offers each backend)
        run: |
          ls -l /dev/kvm 2>&1 || true
          scripts/ci/kvm-host
      # What a hung test's processes are doing, kept as it hangs (scripts/ci/hang-watch.sh),
      # read from the runner: gdb for their backtraces, where the runner boots microVMs, its
      # package index read afresh first, as the glibc job's is.
      - name: Hang watcher's gdb (x86_64)
        if: matrix.part == 'test' && matrix.target == 'x86_64-unknown-linux-musl'
        run: scripts/retry 5 30 sh -c 'sudo apt-get update && sudo apt-get install -y gdb'
      # The test job's build, and the release job's whole part (scripts/ci/alpine).
      - name: ${{ matrix.part == 'test' && 'Build the tests, in Alpine' || 'On the native architecture, in Alpine' }}
        timeout-minutes: ${{ matrix.build_minutes }}
        env:
          MUSL_CI: ${{ matrix.part == 'test' && 'test-build' || matrix.part }}
        run: scripts/ci/alpine
      - name: The runner's image
        if: matrix.part == 'test'
        id: image
        run: echo "image=$ImageOS-$ImageVersion" >> "$GITHUB_OUTPUT"
      # The judge's records, restored and kept as the glibc job's are (`native`, D261). The
      # tests in Alpine keep them in this checkout's target/ as its owner (scripts/musl-ci),
      # whom the actions run as too.
      - name: The judge's records
        if: matrix.part == 'test'
        uses: actions/cache/restore@v6.1.0
        with:
          path: target/judge-records
          key: judge-records-${{ steps.image.outputs.image }}-${{ runner.arch }}-${{ matrix.target }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: judge-records-${{ steps.image.outputs.image }}-${{ runner.arch }}-${{ matrix.target }}-
      - name: Tests, in Alpine
        if: matrix.part == 'test'
        timeout-minutes: ${{ matrix.tests_minutes }}
        run: scripts/ci/alpine
      - name: The judge's records, kept
        if: ${{ !cancelled() && matrix.part == 'test' }}
        uses: actions/cache/save@v6.1.0
        with:
          path: target/judge-records
          key: judge-records-${{ steps.image.outputs.image }}-${{ runner.arch }}-${{ matrix.target }}-${{ github.run_id }}-${{ github.run_attempt }}
      - name: What hung tests' processes were doing
        if: ${{ !cancelled() && matrix.part == 'test' && matrix.target == 'x86_64-unknown-linux-musl' }}
        shell: bash
        run: |
          for f in $(find "$RUNNER_TEMP/hangs" -type f 2>/dev/null | sort); do
            echo "::group::$f"
            cat "$f"
            echo "::endgroup::"
          done
      # A process the seccomp filter ended with its SIGSYS blocked says nothing; the kernel
      # logs the syscall it refused (the filter's SECCOMP_FILTER_FLAG_LOG). Nor does one the
      # host's OOM killer ended: the kernel logs which it chose, and the memory it had. Nor
      # does a VM whose entry failed: KVM logs the VMCS it was refused (scripts/ci/kvm-host).
      - name: What the kernel logged of seccomp refusals, OOM kills and failed VM entries
        if: failure()
        run: |
          sudo dmesg | grep -iE 'seccomp|type=1326|out of memory|oom-kill|killed process' | tail -60 || true
          sudo dmesg | grep -E 'kvm' || true
          free -m || true
      - name: The executable is static
        if: matrix.part == 'release'
        run: |
          bin="target/$TARGET/release/shards"
          if readelf --program-headers "$bin" | grep -q INTERP; then
            echo "$bin requests a program interpreter"; exit 1
          fi
          if readelf --dynamic "$bin" | grep -q NEEDED; then
            echo "$bin needs shared libraries"; exit 1
          fi

name: CI

on:
  push:
    # Every change but a measurement's own scripts, patches, notes and data, and the
    # workflows that run them alone, which no build or test reads: those run their own
    # jobs. A measurement's Rust (tests/fleet.rs and commit.rs take theirs by #[path]) is
    # built here.
    paths:
      - "**"
      - "!docs/research/measurements/**/*.py"
      - "!docs/research/measurements/**/*.sh"
      - "!docs/research/measurements/**/*.patch"
      - "!docs/research/measurements/**/*.md"
      - "!docs/research/measurements/**/*.json"
      - "!docs/research/measurements/**/*.c"
      - "!docs/research/measurements/**/Dockerfile"
      - "!docs/research/measurements/**/*.txt"
      - "!.github/workflows/builder-cold.yml"
      - "!.github/workflows/builder-pressure.yml"
      - "!.github/workflows/dax-budget.yml"
      - "!.github/workflows/dax-huge.yml"
      - "!.github/workflows/dax-boot-memory.yml"
      - "!.github/workflows/envelope.yml"
      - "!.github/workflows/budget-e2e.yml"
      - "!.github/workflows/restore-faults.yml"
      - "!.github/workflows/windows-pipe.yml"
      - "!.github/workflows/windows-watch.yml"
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  TOOLCHAIN: 1.98.1 # keep in sync with rust-toolchain.toml
  # Static musl builds run in this Alpine image on their native architecture. The digest pins
  # the multi-arch index, so each runner pulls its own architecture.
  MUSL_IMAGE: rust:1.98.1-alpine@sha256:7cc1c22d77d9432f7fe012a70e6d3e555af54c2a6832700ed7d553f1769ae89f

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - run: scripts/retry 5 30 rustup toolchain install "$TOOLCHAIN" --profile minimal --component rustfmt
      - run: cargo fmt --all --check

  # The vendored crates are what crates.io publishes, file for file (vendor/README.md).
  vendor:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - run: scripts/vendor-crate --check

  # The dependency graph against RustSec's advisories, and the exceptions' expiry
  # (deny.toml). Apart from `vendor`: a vulnerability is not a provenance question.
  advisories:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - run: scripts/retry 5 30 rustup toolchain install "$TOOLCHAIN" --profile minimal
      - name: cargo-deny 0.20.2, the published build, pinned
        run: |
          curl -fsSL --retry 5 --retry-all-errors --retry-delay 10 -o "$RUNNER_TEMP/deny.tgz" https://github.com/EmbarkStudios/cargo-deny/releases/download/0.20.2/cargo-deny-0.20.2-x86_64-unknown-linux-musl.tar.gz
          echo "9f12ed4c49936e09b48bf862b595cde2fe64fcbd9d74dfacac6131ca824c8d5f  $RUNNER_TEMP/deny.tgz" | sha256sum -c
          tar xzf "$RUNNER_TEMP/deny.tgz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/cargo-deny-0.20.2-x86_64-unknown-linux-musl" >> "$GITHUB_PATH"
      - run: scripts/advisory-exceptions
      - run: cargo deny --locked check advisories

  # The parsers of what registries, images, guests and users send, fuzzed for a bounded
  # time each (fuzz/Cargo.toml). A crash fails the job and prints its input.
  fuzz:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7.0.1
      - run: scripts/retry 5 30 rustup toolchain install nightly-2026-09-05 --profile minimal
      # Built with the pinned stable toolchain: on nightly its locked rustix takes
      # compiler-internal attributes this nightly no longer has.
      - run: scripts/retry 5 30 rustup toolchain install "$TOOLCHAIN" --profile minimal
      - run: cargo +"$TOOLCHAIN" install --locked cargo-fuzz --version 0.13.1
      - run: cargo +nightly-2026-09-05 fuzz build
      - name: Fuzz, 60 s a target
        run: |
          for target in $(cargo +nightly-2026-09-05 fuzz list); do
            if ! cargo +nightly-2026-09-05 fuzz run "$target" -- -max_total_time=60 -rss_limit_mb=2048 -max_len=65536; then
              for crash in fuzz/artifacts/"$target"/*; do echo "$crash:"; xxd "$crash" | head -64; done
              exit 1
            fi
          done

  # Host threads reach guest memory one at a time (docs/design/architecture.md D29):
  # ThreadSanitizer and Miri check the tests where they share it. Both need nightly.
  memory-model:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7.0.1
      - run: scripts/retry 5 30 rustup toolchain install nightly-2026-09-05 --profile minimal --component rust-src,miri
      - run: docs/research/measurements/access-guard/check.sh nightly-2026-09-05

  # The platform matrix (docs/design/architecture.md D13) on native runners. Every target is
  # linted; the ones a runner can execute are tested. VM tests print SKIP where the host has
  # no backend yet or no hardware virtualization. The tests' step has 41 minutes, a third
  # above the slowest measured, 30.2 on x86_64 Linux, and the job 63, with a third above
  # its other steps' slowest, 15.8 on Windows (M245). x86_64 Windows is tested on Windows
  # Server 2022 as well as 2025, each with its hypervisor platform (WHP partitions run on
  # both: PM's windows-2022 and windows-2025 entries), as a daemon's users run both.
  native:
    name: ${{ matrix.name || matrix.target }}
    timeout-minutes: 63
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: aarch64-apple-darwin, runner: macos-15, test: true }
          - { target: x86_64-apple-darwin, runner: macos-15, test: false }
          - { target: x86_64-unknown-linux-gnu, runner: ubuntu-24.04, test: true }
          - { target: aarch64-unknown-linux-gnu, runner: ubuntu-24.04-arm, test: true }
          - { target: x86_64-pc-windows-msvc, runner: windows-2025, test: true }
          - { target: x86_64-pc-windows-msvc, runner: windows-2022, test: true, name: x86_64-pc-windows-msvc (windows-2022) }
          - { target: aarch64-pc-windows-msvc, runner: windows-2025, test: false }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Install pinned Rust
        shell: bash
        # Guest binaries build for every architecture's musl target. Every component
        # rust-toolchain.toml names, here: a cargo proxy that installs one as a later step
        # starts failed once on a file already there ('bin/cargo-fmt').
        run: |
          scripts/retry 5 30 rustup toolchain install "$TOOLCHAIN" --profile minimal --component clippy --component rustfmt \
            --target ${{ matrix.target }} --target x86_64-unknown-linux-musl --target aarch64-unknown-linux-musl
      # shards-init's C (AWS-LC, for the in-VM server's TLS) is compiled by zig on every host
      # (crates/shards/build.rs): 0.16.0, pinned by digest.
      - name: zig
        shell: bash
        run: scripts/install-zig
      # AWS-LC's x64 assembly is built from source, never from the objects aws-lc-sys ships
      # (vendor/README.md), so Windows x64 needs NASM: the official 3.02 build, pinned.
      - name: NASM (Windows x64)
        if: matrix.target == 'x86_64-pc-windows-msvc'
        shell: bash
        run: |
          # Retried: Windows' TLS checks revocation online, and its server is sometimes
          # unreachable (CRYPT_E_REVOCATION_OFFLINE); the digest below checks the file.
          curl -fsSL --retry 5 --retry-all-errors --retry-delay 10 -o "$RUNNER_TEMP/nasm.zip" https://www.nasm.us/pub/nasm/releasebuilds/3.02/win64/nasm-3.02-win64.zip
          echo "161d0bfaff53c2f9e9f3e69fd0672323ebabafd1268976a5cec11be92a19aee7  $RUNNER_TEMP/nasm.zip" | sha256sum -c
          unzip -q "$RUNNER_TEMP/nasm.zip" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/nasm-3.02" >> "$GITHUB_PATH"
      - name: Host virtualization (what this runner offers each backend)
        shell: bash
        run: |
          case "$RUNNER_OS" in
            # And what VFIO may pass through: IOMMU groups, the VFIO and mediated-device
            # (mdev) modules and the kernel's config of them, for a test device.
            Linux)
              ls -l /dev/kvm 2>&1 || true
              ls /sys/kernel/iommu_groups 2>&1 | head -5 || true
              ls /sys/class/mdev_bus 2>&1 || true
              for m in vfio vfio_pci vfio_iommu_type1 mdev mtty mbochs mdpy; do modinfo -F filename "$m" 2>&1 || true; done
              grep -E "CONFIG_(VFIO|VFIO_PCI|VFIO_MDEV|SAMPLE_VFIO_MDEV_MTTY|IOMMUFD|VFIO_NOIOMMU)=" "/boot/config-$(uname -r)" 2>&1 || true
              ;;
            macOS) sysctl kern.hv_support || true ;;
            Windows) powershell -NoProfile -Command \
              "(Get-CimInstance Win32_Processor).Name; (Get-CimInstance Win32_ComputerSystem).HypervisorPresent; (Get-WindowsOptionalFeature -Online -FeatureName HypervisorPlatform).State" || true ;;
          esac
      # The GPU's renderer (D144), from pinned sources: `shards` then carries shards-vm-gpu.
      # Built once for each version of its script and of the runner's image, and kept: its
      # sources' hosts answering 502 and 504 for eight minutes (run 39191414199) left a run
      # with none, and none of its macOS tests ran.
      - name: The GPU's renderer's key
        if: matrix.target == 'aarch64-apple-darwin'
        id: gpu-key
        shell: bash
        run: echo "image=$ImageOS-$ImageVersion" >> "$GITHUB_OUTPUT"
      - name: The GPU's renderer, as built before
        if: matrix.target == 'aarch64-apple-darwin'
        id: gpu-kept
        uses: actions/cache@v6.1.0
        with:
          path: ${{ runner.temp }}/gpu-libs
          key: gpu-libs-${{ steps.gpu-key.outputs.image }}-${{ hashFiles('scripts/gpu-libs') }}
      - name: The GPU's renderer
        if: matrix.target == 'aarch64-apple-darwin'
        shell: bash
        run: |
          if [ "${{ steps.gpu-kept.outputs.cache-hit }}" != true ]; then
            scripts/gpu-libs "$RUNNER_TEMP/gpu-libs"
          fi
          echo "SHARDS_GPU_LIBS=$RUNNER_TEMP/gpu-libs" >> "$GITHUB_ENV"
      - name: Lints (production code never panics; clippy.toml exempts tests)
        shell: bash
        run: cargo clippy --locked --workspace --all-targets --target ${{ matrix.target }} -- -D warnings
      - name: Lints of the GPU's renderer
        if: matrix.target == 'aarch64-apple-darwin'
        shell: bash
        run: cargo clippy --locked -p shards-vmm --features gpu --all-targets --target ${{ matrix.target }} -- -D warnings
      # The runner's /dev/kvm is root:kvm 0660 and the runner user is not in `kvm`.
      - name: KVM access (Linux)
        if: runner.os == 'Linux'
        run: if [ -e /dev/kvm ]; then sudo chmod 666 /dev/kvm; fi
      # The runner user's systemd manager, as a login has one (D183): `--cgroup-parent`'s
      # test makes microVMs under its slices, on its bus.
      - name: User manager (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo loginctl enable-linger "$USER"
          bus="/run/user/$(id -u)/bus"
          for i in $(seq 300); do [ -S "$bus" ] && break; sleep 0.1; done
          ls -l "$bus"
          echo "XDG_RUNTIME_DIR=/run/user/$(id -u)" >> "$GITHUB_ENV"
      # What a hung test's processes are doing, kept as it hangs (scripts/ci/hang-watch.sh):
      # gdb for their backtraces, where the runner boots microVMs.
      - name: Hang watcher's gdb (Linux x86_64)
        if: matrix.test && matrix.target == 'x86_64-unknown-linux-gnu'
        run: scripts/retry 5 30 sudo apt-get install -y gdb
      # Where the runner offers its backend's hypervisor, every VM test must run: one that
      # cannot fails rather than skips (tests/common, SHARDS_REQUIRE_VMS). Every test binary
      # runs, whatever fails before it: a failing one hides none after it.
      - name: Tests
        if: matrix.test
        timeout-minutes: 41
        shell: bash
        run: |
          case "${{ matrix.target }}" in
            # KVM on Linux's, WHP on Windows' (D140); and on Linux, the user's systemd
            # manager (D183).
            x86_64-unknown-linux-gnu) export SHARDS_REQUIRE_VMS=1 SHARDS_REQUIRE_USER_MANAGER=1 ;;
            x86_64-pc-windows-msvc) export SHARDS_REQUIRE_VMS=1 ;;
          esac
          if [ "${{ matrix.target }}" = x86_64-unknown-linux-gnu ]; then
            scripts/ci/hang-watch.sh "$RUNNER_TEMP/hangs" &
            watcher=$!
          fi
          status=0
          cargo test --locked --workspace --profile test-release --no-fail-fast --target ${{ matrix.target }} || status=$?
          if [ -n "${watcher:-}" ]; then kill "$watcher" 2>/dev/null || true; fi
          exit "$status"
      - name: What hung tests' processes were doing
        if: ${{ !cancelled() && matrix.test && matrix.target == 'x86_64-unknown-linux-gnu' }}
        shell: bash
        run: |
          for f in $(find "$RUNNER_TEMP/hangs" -type f 2>/dev/null | sort); do
            echo "::group::$f"
            cat "$f"
            echo "::endgroup::"
          done
      - name: Tests of the GPU's renderer
        if: matrix.target == 'aarch64-apple-darwin'
        timeout-minutes: 15
        shell: bash
        run: |
          cargo test --locked -p shards-vmm --features gpu --profile test-release --target ${{ matrix.target }} gpu::
      # The stack guards are release's (crates/rego: stack::LEAF, RULE_STEP, and the policy
      # thread's STACK): measured on release, whose fat LTO puts more in each frame than
      # test-release does, so the tests that hold every target to them run on release too
      # (M159).
      - name: Stack guards, on release
        if: ${{ !cancelled() && matrix.test }}
        timeout-minutes: 15
        shell: bash
        run: cargo test --locked --release -p shards-rego --test builtins --test deep --test depth --target ${{ matrix.target }}
      # A process the seccomp filter ended with its SIGSYS blocked says nothing; the kernel
      # logs the syscall it refused (the filter's SECCOMP_FILTER_FLAG_LOG). Nor does one the
      # host's OOM killer ended: the kernel logs which it chose, and the memory it had.
      - name: What the kernel logged of seccomp refusals and OOM kills
        if: failure() && runner.os == 'Linux'
        run: |
          sudo dmesg | grep -iE 'seccomp|type=1326|out of memory|oom-kill|killed process' | tail -60 || true
          free -m || true

  # shards against Firecracker on one KVM host: the same kernel, initrd and command line,
  # interleaved (crates/shards/benches/firecracker.rs). Hosted arm64 runners have no /dev/kvm.
  firecracker:
    name: firecracker comparison (x86_64)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Install pinned Rust
        run: scripts/retry 5 30 rustup toolchain install "$TOOLCHAIN" --profile minimal --target x86_64-unknown-linux-musl
      - name: zig
        run: scripts/install-zig
      - name: KVM access
        run: sudo chmod 666 /dev/kvm
      - name: Host
        run: |
          nproc && free -m && lscpu | grep -E 'Model name|Virtualization|Hypervisor'
          grep -H . /sys/kernel/mm/transparent_hugepage/{enabled,defrag,hpage_pmd_size}
      # Every sample, in the order taken, for the envelope and the artifact below.
      - name: Compare
        env:
          SHARDS_BENCH_SAMPLES: ${{ github.workspace }}/target/bench-samples
        run: cargo bench --locked -p shards --bench firecracker -- --runs 30
      # shards no worse than Firecracker on any axis, pair by pair (scripts/bench-envelope,
      # docs/benchmarks-envelope.toml).
      - name: Envelope
        run: scripts/bench-envelope target/bench-samples
      # Guest memory advised for huge pages or not, under the runner's THP (PM M157, M225):
      # what the advice buys a boot, and what it costs a boot's tail where THP gives huge
      # pages to all memory and compacts at a fault only for memory advised.
      - name: THP advice
        if: always()
        env:
          SHARDS_BENCH_SAMPLES: ${{ github.workspace }}/target/bench-samples
        run: cargo bench --locked -p shards --bench firecracker -- --thp-ab all,unadvised --runs 30
      # shards' own restores and pooled runs on this KVM host (docs/benchmarks.md).
      - name: Restore
        if: always()
        env:
          SHARDS_BENCH_SAMPLES: ${{ github.workspace }}/target/bench-samples
        run: cargo bench --locked -p shards --bench restore -- --runs 30
      - name: Image
        if: always()
        env:
          SHARDS_BENCH_SAMPLES: ${{ github.workspace }}/target/bench-samples
        run: cargo bench --locked -p shards --bench image -- --runs 100 --templates 5
      # Requests arriving at rising rates, open loop, past what the host serves
      # (benches/arrival.rs): latency from when each was due, failures, and throughput.
      - name: Arrival
        if: always()
        env:
          SHARDS_BENCH_SAMPLES: ${{ github.workspace }}/target/bench-samples
        run: cargo bench --locked -p shards --bench arrival -- --rates 2,5,10,20,40 --secs 10
      # What the guest kernel keeps of a microVM's memory by its size, on x86_64 (PM M117,
      # measured on arm64): shards sizes a microVM so that -m fits beside it.
      - name: Guest memory (M117)
        if: always()
        run: SHARDS_HOME=$(mktemp -d) docs/research/measurements/guest-memory/measure-direct.sh target/release/shards
      - name: Raw samples
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: bench-samples-${{ github.sha }}
          path: target/bench-samples/
          if-no-files-found: warn

  # Each musl target in two jobs at once: the tests; and the lints, the release build whose
  # executable must be static, and the tests measured on release. One after the other
  # they took 43 of the step's 45 minutes on x86_64 (M156). With the lints and the release
  # tests beside the tests instead, the x86_64 tests took 30 to 45 minutes, slower runners
  # 1.7 times as long as the fastest, and one ran out of time (M187). Two weeks on, slow
  # runners' jobs took 37 to 45 minutes and one ran out of the step's 45, so the step has
  # 60 and the job 70: a third above the slowest (M235).
  musl:
    name: ${{ matrix.target }}${{ matrix.part == 'release' && ' release' || '' }}
    timeout-minutes: 70
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: x86_64-unknown-linux-musl, runner: ubuntu-24.04, part: test }
          - { target: aarch64-unknown-linux-musl, runner: ubuntu-24.04-arm, part: test }
          - { target: x86_64-unknown-linux-musl, runner: ubuntu-24.04, part: release }
          - { target: aarch64-unknown-linux-musl, runner: ubuntu-24.04-arm, part: release }
    runs-on: ${{ matrix.runner }}
    env:
      TARGET: ${{ matrix.target }}
      MUSL_CI: ${{ matrix.part }}
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Host virtualization (what this runner offers each backend)
        run: ls -l /dev/kvm 2>&1 || true
      # What a hung test's processes are doing, kept as it hangs (scripts/ci/hang-watch.sh),
      # read from the runner: gdb for their backtraces, where the runner boots microVMs.
      - name: Hang watcher's gdb (x86_64)
        if: matrix.part == 'test' && matrix.target == 'x86_64-unknown-linux-musl'
        run: scripts/retry 5 30 sudo apt-get install -y gdb
      - name: On the native architecture, in Alpine
        timeout-minutes: 60
        shell: bash
        run: |
          # VM tests need the host's /dev/kvm inside the container, which runs them as the
          # runner's user (scripts/musl-ci): the node there takes this one's mode.
          kvm=""
          if [ -e /dev/kvm ]; then sudo chmod 666 /dev/kvm; kvm="--device /dev/kvm"; fi
          # x86_64 runners offer /dev/kvm: every VM test must run there.
          require=0
          if [ "$TARGET" = x86_64-unknown-linux-musl ]; then require=1; fi
          if [ "$MUSL_CI" = test ] && [ "$TARGET" = x86_64-unknown-linux-musl ]; then
            scripts/ci/hang-watch.sh "$RUNNER_TEMP/hangs" &
            watcher=$!
          fi
          status=0
          docker run --rm $kvm -v "$PWD:/work" -w /work -e TARGET -e MUSL_CI -e SHARDS_REQUIRE_VMS=$require \
            -e CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER=cc \
            -e CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER=cc \
            "$MUSL_IMAGE" scripts/musl-ci || status=$?
          if [ -n "${watcher:-}" ]; then kill "$watcher" 2>/dev/null || true; fi
          exit "$status"
      - name: What hung tests' processes were doing
        if: ${{ !cancelled() && matrix.part == 'test' && matrix.target == 'x86_64-unknown-linux-musl' }}
        shell: bash
        run: |
          for f in $(find "$RUNNER_TEMP/hangs" -type f 2>/dev/null | sort); do
            echo "::group::$f"
            cat "$f"
            echo "::endgroup::"
          done
      # A process the seccomp filter ended with its SIGSYS blocked says nothing; the kernel
      # logs the syscall it refused (the filter's SECCOMP_FILTER_FLAG_LOG). Nor does one the
      # host's OOM killer ended: the kernel logs which it chose, and the memory it had.
      - name: What the kernel logged of seccomp refusals and OOM kills
        if: failure()
        run: |
          sudo dmesg | grep -iE 'seccomp|type=1326|out of memory|oom-kill|killed process' | tail -60 || true
          free -m || true
      - name: The executable is static
        if: matrix.part == 'release'
        run: |
          bin="target/$TARGET/release/shards"
          if readelf --program-headers "$bin" | grep -q INTERP; then
            echo "$bin requests a program interpreter"; exit 1
          fi
          if readelf --dynamic "$bin" | grep -q NEEDED; then
            echo "$bin needs shared libraries"; exit 1
          fi

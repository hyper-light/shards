name: DAX boot memory

# Where a DAX window's boot memory goes on x86_64 CI runners (D189, PM M307): the test
# guest idling with no window and with one of 64 GiB, its VM process's smaps of each
# (docs/research/measurements/dax-window/smaps.sh), on three runners, as CI's x86_64 jobs
# run on runners of more than one kind. Runs when the experiment changes, or when asked.
on:
  push:
    paths:
      - docs/research/measurements/dax-window/smaps.*
      - .github/workflows/dax-boot-memory.yml
  workflow_dispatch:

permissions:
  contents: read

env:
  TOOLCHAIN: 1.98.1 # keep in sync with rust-toolchain.toml

jobs:
  measure:
    name: measure (${{ matrix.copy }})
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        copy: [a, b, c]
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Install pinned Rust
        run: scripts/retry 5 30 rustup toolchain install "$TOOLCHAIN" --profile minimal --target x86_64-unknown-linux-musl
      - name: zig
        run: scripts/install-zig
      - name: KVM access
        run: sudo chmod 666 /dev/kvm
      - name: Build
        run: |
          cargo build --locked -p shards --release
          CC_x86_64_unknown_linux_musl="$PWD/scripts/zig-cc" AR_x86_64_unknown_linux_musl="$PWD/scripts/zig-ar" \
            ZIG_TARGET=x86_64-linux-musl cargo build --locked -p shards-testguest --profile guest \
            --target x86_64-unknown-linux-musl --target-dir target/guest
      - name: The pinned kernel
        run: |
          url=$(grep -o 'https://github.com/hyper-light/shards/releases/download/kernel-[^"]*/vmlinux-6.18.48-x86_64"' crates/shards/src/kernel.rs | tr -d '"')
          sha=$(grep -A 3 "\"$url\"" crates/shards/src/kernel.rs | grep -o '[0-9a-f]\{64\}')
          scripts/retry 5 30 curl -fsSLo vmlinux "$url"
          echo "$sha  vmlinux" | sha256sum -c
      - name: Measure
        run: |
          lscpu | grep -E 'Model name' || true
          uname -r
          free -m
          grep -H . /sys/kernel/mm/transparent_hugepage/{enabled,defrag} || true
          d=docs/research/measurements/dax-window
          guest=target/guest/x86_64-unknown-linux-musl/guest/shards-testguest
          for round in 1 2 3; do
            sh "$d/smaps.sh" target/release/shards vmlinux "$guest" 0 "none-$round.smaps"
            sh "$d/smaps.sh" target/release/shards vmlinux "$guest" 65536 "with-$round.smaps"
            python3 -I "$d/smaps.py" "none-$round.smaps" "with-$round.smaps"
          done

name: builder cold

# What a builder holds cold of its files and plugged past twice what it uses, on real builds
# (the plan "Builders give back what they hold cold and unplug under memory pressure", D133,
# D188), on CI's runners: docs/research/measurements/builder-cold/measure.py over the tree's
# shards with cold.patch, ROUNDS rounds of each build on each of four runners at once; each
# runner's output, check.py's test of it, tables.py's tables and its builds' stderr and
# consoles kept as the run's artifact. x86_64 alone, as hosted arm64 runners have no
# /dev/kvm. Runs when the harness changes, or when asked.
on:
  push:
    paths:
      - docs/research/measurements/builder-cold/**
      - .github/workflows/builder-cold.yml
  workflow_dispatch:

permissions:
  contents: read

env:
  TOOLCHAIN: 1.98.1 # keep in sync with rust-toolchain.toml
  ROUNDS: "6"

jobs:
  measure:
    name: measure (${{ matrix.copy }})
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        copy: [a, b, c, d]
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Install pinned Rust
        run: scripts/retry 5 30 rustup toolchain install "$TOOLCHAIN" --profile minimal --target x86_64-unknown-linux-musl
      - name: zig
        run: scripts/install-zig
      - name: KVM access
        run: sudo chmod 666 /dev/kvm
      # The runner user's systemd manager, as a login has one (D183).
      - name: User manager
        run: |
          sudo loginctl enable-linger "$USER"
          bus="/run/user/$(id -u)/bus"
          for i in $(seq 300); do [ -S "$bus" ] && break; sleep 0.1; done
          ls -l "$bus"
          echo "XDG_RUNTIME_DIR=/run/user/$(id -u)" >> "$GITHUB_ENV"
      # The tree's shards with cold.patch; then the build's own files removed, for the
      # volume's room.
      - name: Build
        run: |
          git apply docs/research/measurements/builder-cold/cold.patch
          cargo build --locked -p shards --release
          cp target/release/shards "$RUNNER_TEMP/shards"
          git checkout -- crates
          rm -rf target
          df -h .
      - name: Measure
        run: |
          lscpu | grep -E 'Model name|Vendor ID|Hypervisor vendor' || true
          # The bases from Docker Hub: ECR Public refuses these runners' anonymous pulls ("Data
          # limit exceeded", run 40281503785).
          python3 -I docs/research/measurements/builder-cold/measure.py "$RUNNER_TEMP/shards" builder-cold \
            --rounds "$ROUNDS" --home "$RUNNER_TEMP/home" --base docker.io/library
          df -h .
      - name: Check
        shell: bash
        run: python3 -I docs/research/measurements/builder-cold/check.py builder-cold/out.txt | tee builder-cold/check.txt
      - name: Tables
        if: ${{ !cancelled() }}
        shell: bash
        run: python3 -I docs/research/measurements/builder-cold/tables.py builder-cold/out.txt | tee builder-cold/tables.txt
      - uses: actions/upload-artifact@v7.0.1
        if: always()
        with:
          name: builder-cold-${{ matrix.copy }}-${{ github.run_attempt }}
          path: builder-cold

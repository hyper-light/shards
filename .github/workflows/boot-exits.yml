name: Boot exits

# Where a cold boot's time goes on an x86_64 KVM runner, shards against Firecracker: each
# VMM's VM exits by reason over its boots, and the guest's initcalls, timed
# (docs/research/measurements/boot-exits).
on:
  push:
    paths:
      - docs/research/measurements/boot-exits/**
      - .github/workflows/boot-exits.yml
  workflow_dispatch:

permissions:
  contents: read

env:
  TOOLCHAIN: 1.98.0 # keep in sync with rust-toolchain.toml

jobs:
  measure:
    name: measure (${{ matrix.copy }})
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        copy: [a, b]
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Install pinned Rust
        run: rustup toolchain install "$TOOLCHAIN" --profile minimal --target x86_64-unknown-linux-musl
      - name: zig
        run: scripts/install-zig
      - name: KVM access
        run: sudo chmod 666 /dev/kvm
      - name: perf
        run: sudo apt-get install -y "linux-tools-$(uname -r)" linux-tools-common
      - name: Host
        run: |
          nproc && free -m && lscpu | grep -E 'Model name|Virtualization|Hypervisor'
          grep -H . /sys/kernel/mm/transparent_hugepage/{enabled,defrag}
      # The comparison's guest, built and fetched as it builds and fetches them.
      - name: Prepare
        run: cargo bench --locked -p shards --bench firecracker -- --runs 1
      - name: Measure
        run: python3 docs/research/measurements/boot-exits/measure.py target/boot-exits 10
      # perf's records are root's: the runner's own to upload.
      - name: Own
        if: always()
        run: sudo chown -R "$(id -u):$(id -g)" target/boot-exits || true
      - uses: actions/upload-artifact@v7.0.1
        if: always()
        with:
          name: boot-exits-${{ matrix.copy }}
          path: target/boot-exits

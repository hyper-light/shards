name: windows pipe

# A Windows named pipe as the stream of a share another server serves, on GitHub's Windows
# runners (docs/research/measurements/windows-pipe, PM M340): an abstract AF_UNIX address's
# connect, a pipe pair's cost and what it refuses once connected, the name each handle to an
# end reports, what a reader gets after its writer closes or exits, and throughput and latency
# beside loopback TCP. Runs when the probe changes, or when asked.
on:
  push:
    paths:
      - docs/research/measurements/windows-pipe/**
      - .github/workflows/windows-pipe.yml
  workflow_dispatch:

permissions:
  contents: read

env:
  TOOLCHAIN: "1.98.1"

jobs:
  run:
    strategy:
      fail-fast: false
      matrix:
        runner: [windows-2022, windows-2025]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Install pinned Rust
        shell: bash
        run: rustup toolchain install "$TOOLCHAIN" --profile minimal --target x86_64-pc-windows-msvc
      - name: Host
        shell: pwsh
        run: |
          (Get-CimInstance Win32_Processor).Name
          [System.Environment]::OSVersion.VersionString
      - name: M340
        shell: bash
        working-directory: docs/research/measurements/windows-pipe
        run: cargo run --release

# Release: `shards`, the one binary (CLAUDE.md), built for every platform of the matrix CI
# tests (ci.yml) and attached to the GitHub Release as it is: one raw binary per OS and
# architecture, named `shards-<os>-<arch>` with OCI's architecture names (`amd64`, `arm64`),
# `-musl` for static Linux, `.exe` on Windows. Nothing is archived, and nothing ships beside
# it: the VM and network processes, shards-init and the in-VM server are carried inside.
#
# Pushing a tag `v<version>` releases; workflow_dispatch builds the matrix alone. With
# `dry_run` (`gh workflow run release.yml -f dry_run=true --ref main`), a dispatch does all a
# tag push does but publish: the guard checks that `v` and crates/shards' version, the tag a
# release of the commit would carry, is no tag yet; the seven binaries build as a tag's do,
# `--locked`; and SHA256SUMS is made as the release makes it. The binaries and SHA256SUMS stay
# the run's artifacts. Only the release job can write to the repository, and a dry run never
# starts it.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      dry_run:
        description: All a tag push does but publish; the binaries and SHA256SUMS stay the run's artifacts
        type: boolean
        default: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  TOOLCHAIN: 1.98.1 # keep in sync with rust-toolchain.toml and ci.yml
  MUSL_IMAGE: rust:1.98.1-alpine@sha256:7cc1c22d77d9432f7fe012a70e6d3e555af54c2a6832700ed7d553f1769ae89f

jobs:
  guard:
    name: The tag is the version
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - run: python3 scripts/check-development-policy
      - if: startsWith(github.ref, 'refs/tags/') && !inputs.dry_run
        run: |
          version=$(grep -m1 '^version' crates/shards/Cargo.toml | cut -d'"' -f2)
          test "v$version" = "$GITHUB_REF_NAME" \
            || { echo "tag $GITHUB_REF_NAME is not crates/shards' version v$version"; exit 1; }
      # A dry run has no tag: the one its commit would be released under is `v` and the
      # version, and pushing that tag releases only if it is new.
      - if: inputs.dry_run
        run: |
          version=$(grep -m1 '^version' crates/shards/Cargo.toml | cut -d'"' -f2)
          test -n "$version" || { echo "crates/shards/Cargo.toml names no version"; exit 1; }
          found=0
          git ls-remote --exit-code --tags origin "refs/tags/v$version" > /dev/null || found=$?
          # git-ls-remote(1): --exit-code exits 2 when origin has no such ref.
          case $found in
            2) echo "$GITHUB_SHA would be released as v$version" ;;
            0) echo "v$version is a tag already: a release needs crates/shards' version raised"; exit 1 ;;
            *) exit "$found" ;;
          esac

  build:
    name: ${{ matrix.asset }}
    needs: guard
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: aarch64-apple-darwin, runner: macos-15, asset: shards-darwin-arm64 }
          - { target: x86_64-unknown-linux-gnu, runner: ubuntu-24.04, asset: shards-linux-amd64 }
          - { target: aarch64-unknown-linux-gnu, runner: ubuntu-24.04-arm, asset: shards-linux-arm64 }
          - { target: x86_64-unknown-linux-musl, runner: ubuntu-24.04, asset: shards-linux-amd64-musl, musl: true }
          - { target: aarch64-unknown-linux-musl, runner: ubuntu-24.04-arm, asset: shards-linux-arm64-musl, musl: true }
          - { target: x86_64-pc-windows-msvc, runner: windows-2025, asset: shards-windows-amd64.exe }
          - { target: aarch64-pc-windows-msvc, runner: windows-2025, asset: shards-windows-arm64.exe }
    runs-on: ${{ matrix.runner }}
    env:
      TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@v7.0.1
      # The commit `shards version` says it was built from, short as docker/cli's
      # (scripts/build/.variables, GITCOMMIT): the same seven characters on every runner.
      - name: The commit
        shell: bash
        run: echo "SHARDS_GIT_COMMIT=${GITHUB_SHA:0:7}" >> "$GITHUB_ENV"
      - name: Install pinned Rust
        if: ${{ !matrix.musl }}
        shell: bash
        # The guests shards carries, and on Linux its VM and network processes, build for the
        # target architecture's musl target (crates/shards/build.rs). Retried, with every
        # component rust-toolchain.toml names, as ci.yml installs it: static.rust-lang.org cut
        # runners' downloads off past rustup's own retries (d8c960214), and the first cargo of a
        # later step, installing those components itself, failed once on a file already there
        # (ba81af327).
        run: |
          scripts/retry 5 30 rustup toolchain install "$TOOLCHAIN" --profile minimal --component clippy --component rustfmt \
            --target "$TARGET" --target x86_64-unknown-linux-musl --target aarch64-unknown-linux-musl
      - name: zig
        if: ${{ !matrix.musl }}
        shell: bash
        run: scripts/install-zig
      - name: NASM (Windows x64)
        if: matrix.target == 'x86_64-pc-windows-msvc'
        shell: bash
        run: |
          curl -fsSL --retry 5 --retry-all-errors --retry-delay 10 -o "$RUNNER_TEMP/nasm.zip" https://www.nasm.us/pub/nasm/releasebuilds/3.02/win64/nasm-3.02-win64.zip
          echo "161d0bfaff53c2f9e9f3e69fd0672323ebabafd1268976a5cec11be92a19aee7  $RUNNER_TEMP/nasm.zip" | sha256sum -c
          unzip -q "$RUNNER_TEMP/nasm.zip" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/nasm-3.02" >> "$GITHUB_PATH"
      # The GPU's renderer (D144, D201, D202), from pinned sources: `shards` then carries
      # shards-vm-gpu, on macOS, on Linux with glibc and on x86_64 Windows; musl's builds
      # make theirs in Alpine (below).
      - name: The GPU's renderer
        if: matrix.target == 'aarch64-apple-darwin' || endsWith(matrix.target, '-linux-gnu') || matrix.target == 'x86_64-pc-windows-msvc'
        shell: bash
        run: |
          scripts/gpu-libs "$RUNNER_TEMP/gpu-libs"
          echo "SHARDS_GPU_LIBS=$RUNNER_TEMP/gpu-libs" >> "$GITHUB_ENV"
      - name: Build
        if: ${{ !matrix.musl }}
        shell: bash
        run: cargo build --locked --release -p shards --target "$TARGET"
      - name: Build on the native architecture, in Alpine
        if: matrix.musl
        run: |
          # The GPU's VM process, linked against Alpine's musl, its renderer built there
          # (D201, scripts/musl-ci); `shards` itself stays static.
          docker run --rm -v "$PWD:/work" -w /work -e TARGET -e SHARDS_GIT_COMMIT -e MUSL_CI=build \
            -e SHARDS_GPU_LIBS=/work/target/gpu-libs \
            -e CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER=cc \
            -e CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER=cc \
            "$MUSL_IMAGE" scripts/musl-ci
          bin="target/$TARGET/release/shards"
          if readelf --program-headers "$bin" | grep -q INTERP; then
            echo "$bin requests a program interpreter"; exit 1
          fi
          if readelf --dynamic "$bin" | grep -q NEEDED; then
            echo "$bin needs shared libraries"; exit 1
          fi
      - name: Stage
        shell: bash
        run: |
          exe=""
          case "$TARGET" in *windows*) exe=.exe ;; esac
          cp "target/$TARGET/release/shards$exe" "${{ matrix.asset }}"
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}
          if-no-files-found: error

  # A dry run's SHA256SUMS, made as the release job makes the release's, under the
  # workflow's read-only token.
  sums:
    name: SHA256SUMS (dry run)
    if: inputs.dry_run
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true
      - name: Checksums
        run: cd artifacts && sha256sum shards-* > SHA256SUMS
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: SHA256SUMS
          path: artifacts/SHA256SUMS
          if-no-files-found: error

  release:
    name: GitHub Release
    if: startsWith(github.ref, 'refs/tags/') && !inputs.dry_run
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true
      - name: Checksums
        run: cd artifacts && sha256sum shards-* > SHA256SUMS
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" --generate-notes artifacts/*

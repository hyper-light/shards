name: restore faults

# Where a restore's time to its first beat goes on CI's runners, shards' and Firecracker's
# alike: the Firecracker comparison (crates/shards/benches/firecracker.rs), whose restore
# arm reads KVM's counters of each restored VM as its guest first beats, and traces 30
# more restores of each VMM in KVM (`--traced`), on eight runners at once, each runner's
# CPU as it lands (docs/research/measurements/restore-faults). Each runner also runs the
# comparison reading nothing (SHARDS_BENCH_KVM=off), in turn first, so that each
# envelope's verdicts read and unread are set side by side. Half the runners are
# ubuntu-26.04's, whose kernel is Linux 7.0 (its ext4 maps a restored snapshot's large
# folios, PM M290), the rest ubuntu-24.04's (6.17). Runs when the experiment changes, or
# when asked.
on:
  push:
    paths:
      - docs/research/measurements/restore-faults/**
      - .github/workflows/restore-faults.yml
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  TOOLCHAIN: 1.98.1 # keep in sync with rust-toolchain.toml

jobs:
  compare:
    name: compare (${{ matrix.copy }}, ${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - { copy: a, runner: ubuntu-26.04 }
          - { copy: b, runner: ubuntu-26.04 }
          - { copy: c, runner: ubuntu-26.04 }
          - { copy: d, runner: ubuntu-26.04 }
          - { copy: e, runner: ubuntu-24.04 }
          - { copy: f, runner: ubuntu-24.04 }
          - { copy: g, runner: ubuntu-24.04 }
          - { copy: h, runner: ubuntu-24.04 }
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Install pinned Rust
        run: scripts/retry 5 30 rustup toolchain install "$TOOLCHAIN" --profile minimal --target x86_64-unknown-linux-musl
      - name: zig
        run: scripts/install-zig
      - name: KVM access
        run: sudo chmod 666 /dev/kvm
      - name: Host
        run: |
          nproc && free -m && lscpu | grep -E 'Model name|Virtualization|Hypervisor'
          uname -r
          # Which of Hyper-V's enlightenments this runner's KVM took (svm_onhyperv.c, vmx.c).
          sudo dmesg | grep -i -E 'hyper-v|enlightened|direct tlb flush' | head -20 || true
      - name: Compare, reading and reading nothing
        run: |
          reading() {
            SHARDS_BENCH_SAMPLES="$PWD/target/bench-samples/read" \
              cargo bench --locked -p shards --bench firecracker -- --runs 30 --traced 30
          }
          reading_nothing() {
            SHARDS_BENCH_SAMPLES="$PWD/target/bench-samples/unread" SHARDS_BENCH_KVM=off \
              cargo bench --locked -p shards --bench firecracker -- --runs 30
          }
          case "${{ matrix.copy }}" in
            a|c|e|g) reading && reading_nothing ;;
            *) reading_nothing && reading ;;
          esac
      - name: Envelope
        if: always()
        run: scripts/bench-envelope target/bench-samples/read
      - name: Envelope, reading nothing
        if: always()
        run: scripts/bench-envelope target/bench-samples/unread
      - name: Faults
        if: always()
        run: python3 -I docs/research/measurements/restore-faults/faults.py target/bench-samples/read
      - uses: actions/upload-artifact@v7.0.1
        if: always()
        with:
          name: restore-faults-${{ matrix.copy }}
          path: target/bench-samples/

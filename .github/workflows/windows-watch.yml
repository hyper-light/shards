name: windows watch

# What a Windows directory watch hears of a file's writes, beside what a read oplock hears, on
# GitHub's Windows runners (docs/research/measurements/windows-watch, PM M344): whether
# ReadDirectoryChangesW says an append by a writer that holds its file open, how soon a name
# made is said, whether a read oplock is granted beside that writer and how soon each append
# breaks it, and how a directory's handle is opened again. Runs when the probe changes, or
# when asked.
on:
  push:
    paths:
      - docs/research/measurements/windows-watch/**
      - .github/workflows/windows-watch.yml
  workflow_dispatch:

permissions:
  contents: read

env:
  TOOLCHAIN: "1.98.1"

jobs:
  run:
    strategy:
      fail-fast: false
      matrix:
        runner: [windows-2022, windows-2025]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Install pinned Rust
        shell: bash
        run: rustup toolchain install "$TOOLCHAIN" --profile minimal --target x86_64-pc-windows-msvc
      - name: Host
        shell: pwsh
        run: |
          (Get-CimInstance Win32_Processor).Name
          [System.Environment]::OSVersion.VersionString
      - name: M344
        shell: bash
        working-directory: docs/research/measurements/windows-watch
        run: cargo run --release
